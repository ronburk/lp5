        <script>
         const originalAssert = console.assert;
         console.assert = function(condition, message, ...optionalParams) {
             if (!condition) {
                 originalAssert(condition, message, ...optionalParams);
                 throw new Error(message);
             }
         };

         window.lp5 = {};
         function parseTag(str, startPos){
             const result = {
                 name:       "",
                 isStart:    true,
                 emptyTag:   false,
                 attributes: [],
                 nextPos:    startPos,
                 errorPos:   -1
             };
             const tagPattern = /<(\/)?\s*([A-Za-z_:][A-Za-z0-9:._-]*)\s*/y;
             tagPattern.lastIndex = startPos;
             let  match = tagPattern.exec(str);
             PARSE:{
                 if(!match) break PARSE;
                 if(match[1]) result.isStart = false;
                 result.name = match[2];
                 result.nextPos = tagPattern.lastIndex;
                 const attrPattern = /\s*([A-Za-z_:][A-Za-z0-9:._-]*)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^>\s]+)))?\s*/y;
                 attrPattern.lastIndex = tagPattern.lastIndex;
                 while ((match = attrPattern.exec(str)) !== null) {
                     const attrName = match[1];
                     const attrValue = match[2] || match[3] || match[4] || null;
                     result.attributes.push({name:attrName, value:attrValue});
                     result.nextPos = attrPattern.lastIndex;
                 }
                 const trailing = /^\s*(\/)?\s*>/.exec(str.slice(result.nextPos));
                 if (!trailing){
                     console.warn("couldn't match end of tag");
                     break PARSE;
                 }
                 result.emptyTag = trailing[1] === "/";
                 result.nextPos += trailing[0].length;
                 return result;
             }
             return null;
         }
         function classifyTag(tagDescriptor){
             tagDescriptor.type = null;
             if(tagDescriptor.name == 'lp5-'){
                 if(tagDescriptor.emptyTag)
                     if(tagDescriptor.attributes.length == 1)
                         if(tagDescriptor.attributes[0].name == 'ref'){
                             tagDescriptor.type = 'ref';
                             tagDescriptor.value = tagDescriptor.attributes[0].value;
                         }
             } else if(tagDescriptor.name == 'lp5-endscript'){
                 if(tagDescriptor.attributes.length == 0)
                     if(tagDescriptor.emptyTag)
                         tagDescriptor.type = 'endscript';
             }
             return tagDescriptor.type;
         }
         /* parseCode() - break code into text and directives.
          *
          * returns an array, where each element is either a string
          * of literal text or an lp5 tag descriptor.
          */
         function parseCode(scriptNode){
             const result = [];
             let scriptText = scriptNode.childNodes[0].textContent;
             scriptText = scriptText.replace(/^[ \t\n]*/, '');
             console.log(`scriptText = '${scriptText}'`, scriptNode);
             const tagPattern = /<(\/)?\s*lp5-/g;  // lp5 start or end tag
             let   posStart     = 0;
             let   posNext      = 0;
             let   length       = scriptText.length;
             let   match;
             while(posNext < length){
                 posStart             = posNext;
                 tagPattern.lastIndex = posStart;
                 match                = tagPattern.exec(scriptText);
                 if(match == null)
                     posNext     = length;
                 else
                     posNext = match.index;
                 console.warn("pattern match was ", match);
                 if(posStart < posNext)
                     result.push(scriptText.substring(posStart, posNext));
                 if(match){
                     const tagDescriptor = parseTag(scriptText, match.index);
                     console.warn("parseTag() returns ", tagDescriptor);
                     if(tagDescriptor){
                         let typename = classifyTag(tagDescriptor);
                         // console.assert(false, typename);
                         if(tagDescriptor.type === 'ref'){
                             const lineStart = scriptText.lastIndexOf('\n', match.index)+1;
                             const prefix = scriptText.substring(lineStart, match.index);
                             tagDescriptor.indent = /^[ ]*$/.test(prefix) ? prefix.length : 0;
                         }
                         result.push(tagDescriptor);
                         posNext = tagDescriptor.nextPos;
                     }
                     else{
                         result.push("BAD LP5 TAG:<");
                         ++posNext;
                     }
                 }
             }
             console.warn("<<<<<<<<<<parseCode() returns ", result);
             return result;
         }
         function showFatalError(message) {
             // 1) Show a big overlay blocking the page
             const overlay = document.createElement("div");
             overlay.style.position = "fixed";
             overlay.style.top = "0";
             overlay.style.left = "0";
             overlay.style.width = "100%";
             overlay.style.height = "100%";
             overlay.style.backgroundColor = "rgba(0,0,0,0.8)";
             overlay.style.color = "white";
             overlay.style.fontSize = "1.2em";
             overlay.style.zIndex = "999999";
             overlay.style.display = "flex";
             overlay.style.flexDirection = "column";
             overlay.style.justifyContent = "center";
             overlay.style.alignItems = "center";

             overlay.innerHTML = `
                 <h1>Fatal Error</h1>
                 <p>${message}</p>
             `;
             document.body.appendChild(overlay);

             // 2) Also log to console for developers
             console.error("FATAL ERROR:", message);

             // 3) Throw an error so that no further code in this call stack runs
             throw new Error("FATAL: " + message);
         }
         console.error("We end first script!");
        </script>

        <template data-custom="lp5-treeview">
            <!-- Hierarchical Treeview -->
            <style>
             /* Base font size for scaling */
             html {
                 font-size: 16px; /* Default size, easily scalable */
             }

             /* Remove default padding and inline-start indentation on ul to prevent first-level items from being indented */
             ul.treeview {
                 list-style-type: none;
                 padding-left: 0; /* Remove the default padding */
                 padding-inline-start: 0; /* Remove the default inline-start padding */
                 margin: 0;
             }

             /* Indentation for nested <ul> elements using em to scale */
             ul.treeview ul {
                 padding-left: 1.00em; /* Indent nested lists based on font size */
                 list-style-type: none; /* Remove list bullet points */
             }

             /* Indentation for <li> elements */
             li {
                 cursor: pointer;
                 display: block;
                 position: relative;
                 font-size: 1rem; /* Use rem to scale font size proportionally */
                 user-select: none; /* Disable text selection on list items */
             }

             /* For all li elements, apply the triangle (default state) */
             li::before {
                 content: "\25B6 "; /* Right-pointing triangle */
                 margin-right: 0;
                 cursor: pointer;
                 display: inline-block;
                 width: 1em; /* Triangle width */
                 height: 1em; /* Ensure consistent height */
                 text-align: center;
                 font-size: 0.75em; /* Triangle size */
                 line-height: 1em;
             }

             /* Hide the triangle for li elements that do not have a <ul> as a direct child */
             li:not(:has(> ul))::before {
                 visibility: hidden; /* Hide the triangle */
             }

             /* Horizontal line indicating where the dragged item will go */
             li.drop-target-before {
                 box-shadow: inset 0 2px 0 0 rgba(0, 123, 255, 0.5); /* Shadow on the top of the element */
             }

             /* Horizontal line indicating the "after" drop location */
             li.drop-target-after {
                 box-shadow: inset 0 -2px 0 0 rgba(0, 123, 255, 0.5); /* Shadow on the bottom of the element */
             }

             /* Highlight the target area while dragging */
             li.over {
                 border: 2px dashed #007bff; /* Adds a dashed border to indicate a valid drop area */
                 background-color: #f0f8ff;  /* Light background to highlight the target */
             }

             /* When an item is being dragged, reduce its opacity */
             li.dragging {
                 opacity: 0.1;  /* Makes the dragged item semi-transparent */
             }

             /* When the container item is expanded, use the down-pointing triangle */
             li.expanded::before {
                 content: "\25BC "; /* Downward-pointing triangle */
             }

             /* Ensure nested <ul> elements are collapsed by default */
             ul.nested {
                 display: none;
             }

             /* When active, display nested <ul> */
             ul.nested.active {
                 display: block;
             }

             /* Style for the selected item */
             .selected {
                 background-color: lightblue;
                 font-weight: bold;
             }

             span {
                 font-size: 1rem; /* Use rem for text size */
             }

            </style>

            <script>
             function makeAllLiDraggable(ancestor, ){
                 const items = ancestor.querySelectorAll('li');
                 items.forEach(item => {
                     item.setAttribute('draggable', 'true');
                 });
                 console.log("makeAllLiDraggable returns");
             }
             // Add an event listener on the UL element (capture phase)
             //             treeView.addEventListener('click', function(event) {
             function clickHandler(event){
                 console.log("clickHandler!!!!!");
                 const target = event.target;
                 const li = target.closest('li');
                 
                 if (li) {
                     const span = li.querySelector(':scope > span');
                     const nestedUl = li.querySelector('ul');
                     
                     // Only show triangle if li contains nested ul (container item)
                     if (nestedUl) {
                         if (target === span) {
                             selectItem(span);
                         } else {
                             toggleList(li);
                         }
                     } else if (target === span) {
                         // For non-container items, just select the item
                         selectItem(span);
                     }
                 }
             }

             class TreeView extends LP5Element {
                 constructor(){
                     super(require('template'));
                 }
                 #treeView = null;
                 connectedCallback(){
                     super.connectedCallback();
                     this.#treeView = this.elements["lp5-treeview"];
                     console.assert(this.#treeView, "Missing <ul data-id='lp5-treeview'>");
                     makeAllLiDraggable(this.#treeView);
                     this.#treeView.addEventListener('click', clickHandler, true);
                 }
             }
       if(false) if(treeView.dataset.drag){
                 console.log("Draggable!");
                 const items = treeView.querySelectorAll('li');
                 items.forEach(item => {
                     item.setAttribute('draggable', 'true');
                 });

             }

             function move(liFrom, liTo, relPos){
                 console.log("move", liFrom, liTo, relPos);
             }

             // drag-and-drop code
             let previousTarget     = null;  // Store the last hovered element
             let currentTarget      = null;

             function dragAndDrop(){
                 let currentDragSource  = null;
                 let currentDropTarget  = null;
                 let undo               = () => null;
                 let relPos             = null;
                 const api              = {}

//                 treeView.addEventListener('dragstart', function(event) {
                 api.dragstart = function dragstart(event) {
                     const li = event.target.closest('li');
                     console.log("dragstart", li);
                     if(li){
                         li.classList.add('dragging');
                         currentDragSource = li;
                         event.dataTransfer.dropEffect    = "move";
                         event.dataTransfer.effectAllowed = "move";
                     }
                 }

//                 treeView.addEventListener('dragenter', function(event) {
                 api.dragenter = function dragenter(event){
                     event.preventDefault();  // Allow the drop
                 }
                 api.dragover = function dragover(event){
                     event.preventDefault();  // Allow the drop
                     const li = event.target.closest('li');

                     if (li){
                         undo();
                         if(!li.classList.contains('dragging')){
                             const rect    = li.getBoundingClientRect();
                             const upper   = event.clientY < rect.top + rect.height / 2;
                             relPos = upper ? 'before' : 'after';
                             const dropClass = 'drop-target-' + relPos;
                             li.classList.add(dropClass);
                             undo =  () => li.classList.remove(dropClass);
                         } else
                             undo = () => null;
                         currentDropTarget = li;
                     }
                 }

                 // Event listener for dragend (cleanup after the drag is done)
                 api.dragend = function dragend(event){
                     const draggedItem = event.target;
                     if (draggedItem.tagName === 'LI')
                         draggedItem.classList.remove('dragging');
                     undo();
                 }


                 // Event listener for drop events on the parent UL element
                 api.drop = function drop(event){
                     event.preventDefault();
                     const target = event.target.closest('li');
                     console.log("drop", target);

                     target.classList.remove('over');
                     currentTarget = null;

                     api.move(currentDragSource, currentDropTarget, relPos);
                 }
                 return  api;
             }
             const dragApi = dragAndDrop();
             let selected = null;

             // Toggle expand/collapse for nested lists
             function toggleList(li) {
                 const nestedList = li.querySelector('.nested');
                 if (nestedList) {
                     nestedList.classList.toggle('active');
                     li.classList.toggle('expanded');
                 }
             }

             // Function to select an item and highlight it
             function selectItem(span) {
                 selected?.classList.remove('selected');
                 span.classList.add('selected');
                 selected = span;
             }

             // On page load, ensure no nested lists are visible initially
             window.onload = function() {
                 //             const nestedLists = document.querySelectorAll('.nested');
                 //             nestedLists.forEach(nested => nested.classList.remove('active')); // Ensures all nested lists are collapsed initially
             }
             return TreeView;
             function init(){}
             function render(){}
             return {init, render };
            </script>

        </template>

console.log("before scopedEval2 return");

                                 iView.notify.hasOwnProperty('render'),
                                 `template '${iView.name}' didn't return .render()`);
                         } else {
                             console.log("notify set to null!");
                             iView.notify = null;
                         }
                         // two templates with same name is a mistake
                         console.assert(!this.views.hasOwnProperty(iView.name));

                         if(!parentView){ // if this is an outermost template
                             // recurse to handle any nested children
                             this.loadTemplates(iView.rootNode.shadowRoot, iView);
                             this.views[iView.name] = iView;
                         } else {
                             parentView.children[iView.name] = iView;
                         }

                     });

                     if(!parentView){
                         // known starting view must be defined
                         console.assert(this.views.hasOwnProperty('home'));
                     }
                 },
                 notifyChange(eventName){
                     //                     eventTarget.dispatchEvent(
                 },
                 exists(viewName) {
                     return this.views.hasOwnProperty(viewName);
                 },
                 change(viewName) {
                     console.log(`views.change(${viewName})`);
                     this.inProgress++;
                     // get interface to incoming view
                     const newView = this.views[viewName];
                     //                 this.currentView = this.views[viewName];
                     //                 console.assert(this.currentView);
                     console.assert(newView);
                     this.setBody(newView);
                     --this.inProgress;
                     //                 this.currentView.notify.init();
                     this.init(this.currentView);
                 },
                 init(iView, ...args){
                     console.log("init iView ", iView);
                     if(iView.notify){
                         console.log("    childcount= ", iView.children.length);
                         iView.notify.init(iView, ...args);
                     } else {
                         console.log("   (no notify function!)");
                     }
                     if(iView.children)
                         Object.keys(iView.children).forEach(childName => {
                             this.init(iView.children[childName], ...args);
                         });
                 },
                 respond(...args){
                     let iView = this.currentView;

                     if(iView.notify && iView.notify.respond)
                         iView.notify.respond(iView, ...args);
                     else
                         console.log("respond not forwarded for ", iView);
                 },
                 render(iView, ...args){
                     if(!iView)
                         iView = this.currentView;
                     const childNames = Object.keys(iView.children);
                     console.log("render ", iView);
                     if(iView.notify)
                         iView.notify.render(iView, ...args);
                     console.log(iView, childNames);
                     childNames.forEach((i)=>this.render(iView.children[i], ...args));
                 },
                 push(dialogName, ...args) {
                     console.log("views.push ", dialogName);
                     ++this.inProgress;
                     //                     console.assert(this.currentView);
                     this.stack.push(this.currentView);
                     const iView = this.views[dialogName];
                     this.setBody(iView);
                     this.currentView = iView;
                     console.log("views.push calls init for ", iView);
                     this.init(this.currentView, ...args);
                     this.render(this.currentView, ...args);
                     this.currentView.dialogNode.addEventListener('close', controller, true);
                     --this.inProgress;
                 },
                 pop() {
                     ++this.inProgress;
                     const currentView = this.currentView;
                     console.assert(currentView.dialogNode);
                     console.assert(currentView);
                     console.log("pop() this.current = ", currentView);
                     // our root is a div containing a dialog
                     const liveRootNode   = document.body.firstElementChild;
                     const liveDialogNode = liveRootNode.shadowRoot.querySelector("dialog");
                     console.assert(liveDialogNode.nodeName == "DIALOG");
                     // don't confuse controller with 'close' event not initiated by user
                     liveDialogNode.removeEventListener('close', controller, true);
                     liveDialogNode.close();
                     console.log("pop() closes dialog");
                     liveRootNode.remove();
                     this.currentView = this.stack.pop();
                     history.pushState(null, "", `#${this.currentView.name}`);
                     --this.inProgress;
                 },
                 onHashChange(event){
                     console.log("onHashChange(): ", event);
                     // newHash = everything after '#'
                     let newHash = event.newURL.replace(/^[^#]*#/, '');
                     // newPage = everthing after '#' and before any '/'
                     let newPage = newHash.replace(/^([^/]+).*/, '$1');
                     console.log("newHash = ", newHash, "newPage = ", newPage);
                     //                 location.replace("#"+newHash);
                     //                 LP5.setBody(newHash);
                     if(!LP5.views.exists(newPage)){
                         alert(`unknown URL: ${newPage}`);
                         history.back();
                     }
                     else if(LP5.views.inProgress <= 0)
                         LP5.views.change(newPage);
                 },
                 setBody(iView){
                     const {name}      = iView;
                     const currentView = this.currentView;
                     const body        = document.body;

                     console.log(`setBody(${name})`);
                     history.pushState(null, "", "#" + name);
                     console.log(`history.pushState("#${name}")`);
                     // give current view back its nodes
                     // this only happens when change()ing one non-dialog to another
                     if(currentView && !iView.dialogNode){
                         console.log(`Giving ${currentView.name} back its nodes.`);
                         currentView.rootNode.replaceChildren(body.firstElementChild);
                     }

                     console.assert(!iView.rootNode.shadowRoot.querySelector('script'));
                     // dialogs get shoved into the start of body,
                     // leaving lower layers visible
                     if(iView.dialogNode){
                         console.log("body.prepend ", iView.rootNode);
                         body.prepend(iView.rootNode);
                         iView.dialogNode.showModal();
                     } else {
                         document.body.replaceChildren(iView.rootNode);
                         /* if not showing dialog, autofocus only valid on page load,
                          * so fix that manually.
                          * https://html.spec.whatwg.org/multipage/interaction.html#the-autofocus-attribute
                          */
                         //                         let focus = document.body.querySelector("input[autofocus]");
                         //                         if(focus)
                         //                             focus.focus();
                     }
                     this.currentView = iView;
                 }
             };

             controller.compile = function(resource){
                 let output = '';
                 console.assert(false);
                 return output;
             }

             let model = {};
             model.nextArticleID    = 0;
             model.storage          = null;
             //             model.dirHandle        = null;
             model.dirParentHandle  = null;
             model.projectName      = new Map;
             model.urlToResource    = null;
             model.articles         = new Articles();
             model.rootTOC          = null;
             model.projects         = {};
             model.anchorNameToNode = new Map();
             model.updateDerivedState = function(){
                 console.log("updateDerivedState!!!!!!");
                 function pushArticle(object, name, article){
                     const articles = object[name] ?? [];
                     articles.push(article);
                     object[name] = articles;
                 }
                 function getTocOrder(article, array=[]){
                     array.push(article);
                     const ulNode = article.ulNode;
                     if(ulNode)
                         for(const entry of ulNode.querySelectorAll(':scope > li')){
                             let id     = entry.getAttribute('id');
                             getTocOrder(model.articles.fromURL(id), array);
                         }
                     return array;
                 }
                 // array of articles in Table of Contents order
                 model.tocOrder = getTocOrder(model.rootTOC);
                 console.log("updateDerivedState!!!!!! tocOrder = ", model.tocOrder);
                 // hash that makes code section names to articles (in ToC order)
                 const codeNameToDefiningArticles = {}; // arrays of all the articles with a given code name
                 const codeNameToReferringArticles = {};
                 const articlesFromName = {};
                 for(const article of model.tocOrder){
                     console.log("checking article: ", article);
                     if(article.getCodeSerial()){
                         console.log("pushing code article ", article);
                         (articlesFromName[article.getCodeName()] ??= []).
                           push(article);
                         const name = article.getCodeName();
                         for(const item of article.codeParsed){
                             console.log("YYY", name, item);
                             if(name && item?.type === 'ref'){
                                 pushArticle(codeNameToReferringArticles, name, article);
                             }
                         }
                         if(name)
                             pushArticle(codeNameToDefiningArticles, name, article);
                     }
                 }
                 model.codeNameToDefiningArticles  = codeNameToDefiningArticles;
                 model.codeNameToReferringArticles = codeNameToReferringArticles;
                 model.articlesFromName            = articlesFromName;
                 for(const article of model.tocOrder){
                     const name = article.getCodeName();
                     if(name && name !== ''){
                     }
                 }
             }
             model.articlesMatchingName = function (name){
                 const matches = model.articlesFromName[name];
                 if(matches)
                     return matches;
                 else
                     return [];
             }
             model.createUniqueFile = async function (){
                 let handle = await this.storage.createUniqueFile(
                     "%d.lp5", this.nextArticleID);
                 if(handle){
                     let dotPos = handle.name.indexOf('.');
                     this.nextArticleID = 1 + handle.name.slice(0,dotPos);
                 }
                 return handle;
             };

             if(false){
                 model.articleFromArticleNode = function(node){
                     // the article node ID contains the article #
                     let id = node.id;
                     console.assert(id);
                     id = node.id.replace(/^article-/,'');
                     console.assert(id >= 0);
                     console.assert(id < this.articles.length);
                     let result = this.articles[id];
                     console.assert(result, {id:id});
                     return result;
                 }
                 model.articleFromURL = function(url){
                     for(const article of this.articles)
                         if(article.URL == url)
                             return article;
                     return null;
                 }
             }
             // we want to create the backing store first, to
             // make sure we can.
             model.createEmptyArticle = async function (location, targetArticle){
                 // location: -1 = before, 0 = first child, 1 = after
                 console.log("createEmptyArticle ", location, targetArticle);
                 // create empty resource
                 let handle  = await model.createUniqueFile();
                 console.assert(handle);
                 let emptyArticleName = handle.name;
                 let parentArticle = null;
                 if(targetArticle){
                     if(location == 0)
                         parentArticle = targetArticle;
                     else {
                         console.assert(targetArticle.parent);
                         parentArticle = targetArticle.parent;
                     }
                 }
                 let newArticle = model.articles.newArticle(
                     parentArticle, emptyArticleName);
                 let serial = newArticle.toSerial();
                 let writable = await handle.createWritable();
                 await writable.write(serial);
                 await writable.close();
                 // must update some parent article correctly to point to new empty

                 // if very first article of project
                 if(!targetArticle)
                     return;

                 if(location == 0)
                     parentArticle.addFirstChild(newArticle);
                 else if(location == -1)
                     parentArticle.addChildBefore(newArticle, targetArticle);
                 else if(location == 1)
                     parentArticle.addChildAfter(newArticle, targetArticle);
                 else
                     console.assert(false);

                 let changedArticle = location ? targetArticle.parent : targetArticle;
                 serial = parentArticle.toSerial();
                 console.log("write changed article", parentArticle, serial);
                 await model.storage.write(parentArticle.URL,serial);
                 model.updateDerivedState();
             };
             model.docOrder = function*(article){
                 console.assert(this.articles); // detect bogus 'this'
                 yield article;
                 let ulNode = article.ulNode;
                 if(ulNode)
                     for(const entry of ulNode.querySelectorAll(':scope > li')){
                         console.log(entry);
                         let id     = entry.getAttribute('id');
                         yield* this.docOrder(this.articles.fromURL(id));
                     }
             }
             model.codeOrder = function*(queue = null){
                 if(queue === null){ // if initial iteration
                     queue = [];
                     for(const resource of this.docOrder(this.rootTOC))
                         if(resource.codeNode && !resource.codeNameNode){
                             yield resource;
                             queue.push(resource);
                         }
                 }
             }
             model.storeResource = async function(articleNode, serial){
                 console.log("storeResource ", articleNode, serial);
                 let article = this.articles.fromArticleNode(articleNode);
                 await this.storage.write(article.URL, serial);
                 return true;
             }
             model.loadResource = async function(url){
                 let result = { loaded : true, url : url }
                 try {
                     const fileHandle = await this.dirHandle.getFileHandle(url);
                     console.assert(fileHandle);
                     // open, load file into string, close
                     const file = await fileHandle.getFile();
                     result.text = await file.text();
                 } catch (error) {
                     result.error  = error;
                     result.loaded = false;
                 }
                 return result;
             }
             model.loadArticle = async function(dirHandle, filename, parent){
                 const articleText = await this.loadResource(filename);
                 let text = articleText.text;
                 if(!articleText.loaded){
                     text = `
<template>
    <section>
    <h2>FAILED LOAD OF "URL": ERROR</h2>
<div style="background-color: #ffcccc; border: 2px solid #ffcc00; padding: 10px; margin: 10px 0; font-family: sans-serif;">
           <p>
<span style="font-size: 24px;">&#9888;</span>MSG
           </p>
       </div>

    </section>
</template>`;
                     text = text.replace(/URL/, articleText.url);
                     text = text.replace(/ERROR/, articleText.error.name);
                     text = text.replace(/MSG/, articleText.error.message);
                 }
                 return this.articles.fromSerial(parent, filename, text);
             }
             model.loadTOC = async function(dirHandle, name, parent=null){
                 console.log("loadTOC ", name);
                 if(parent == null)
                     this.articles.reset();
                 let article = await this.loadArticle(dirHandle, name, parent);
                 console.log("loadTOC back from await of loadArticle ", name, article);
                 let match = name.match(/^[0-9]+/);
                 if(match && match[0] > model.nextArticleID)
                     model.nextArticleID = Number(match[0]);
                 // if article contains a <ul>, it is parent of other articles
                 if(article.ulNode){
                     console.log(`in loadTOC, article "${name}" has a ul`);
                     const entries = article.ulNode.querySelectorAll('li');
                     for(const li of entries){
                         let ID = li.getAttribute('id');
                         let child = await this.loadTOC(dirHandle, ID, article);
                         article.children.push(child);
                     }
                 } else
                     console.log(`in loadTOC, article "${name}" has NO ul`);
                 console.log(`loadTOC(${name}) returns `, article);
                 return article;
             }

             model.openProject = async function(name){
                 console.log("openProject ", name, this.projects);
                 const {dirHandle} = this.projects[name];
                 console.log("dirHandle ", dirHandle);
                 this.dirHandle = dirHandle;
                 this.storage   = new Storage(dirHandle);
                 this.rootTOC   = await this.loadTOC(dirHandle, name);
                 console.log("openProject got rootTOC of ", this.rootTOC);
                 console.assert(this.rootTOC.URL == name, this.rootTOC);
                 console.log("OpenProject returns after scheduling asyncComplete");
                 return true;
             }
             controller.model = model;
         }();
        </script>
    </body>
