                            <span style="background-color:#ffffa0; border-radius:50%; cursor:help;" title="I need access to the parent directory to place generated files there.&#10;A user click is required by Chrome for me to ask for this permission.">&#9432</span>

                <script>
                 (function(){

        <template data-name="EnterDirectory">
            <div style="position:absolute; top:50%; left:50%;">
                <dialog>
                    <form method="dialog">
                        <label>No existing lp5 projects found. Enter (directory) name for new project:</label>
                        <input id='lp5InputFile' type='text' autofocus>
                        <input type="button" value="Create" onclick="LP5.createProject(this);">
                        <input type="button" value="Cancel" onclick="LP5.cancelNewProject(this);">
                    </form>
                </dialog>
            </div>
        </template>
        <template data-name="UnknownHash">
            <div style="position:absolute; top:50%; left:50%;">
                <dialog>
                    <form method="dialog">
                        <label>I don't recognize this URL:</label>
                        <input type="button" value="Cancel" onclick="LP5.cancelNewProject(this);">
                    </form>

        <template data-name="lp5-main-page">
            <div>
                <p>main page</p>
            </div>
        </template>
        <template data-name="lp5-new-section">
            <div>
                
            </div>
        </template>
        <template data-name="home">
            <div class="lp5-body" onclick="console.log('Whoo hoo');">
                <style>
                 .lp5-body {
                     display: grid;
                     grid-template-areas:
                         "menu menu menu"
                         "toc source output"
                         "footer footer footer";
                     grid-template-rows: 60px 3fr 60px;
                     grid-template-columns: 1fr 3fr 1fr;
                     grid-gap: 10px;
                     height: 100vh;
                     margin: 0;
                 }
                 #LP5-Footer{
                     grid-area: footer;
                     background:#d0d0d0;
                 }
                 #LP5-Toc a {text-decoration: none;}
                 #LP5-Toc a:visited { color: rgb(0,0,238); }
                 #LP5-Toc {
                     font-family: Helvetica;
                     grid-area: toc;
                 }
                 #LP5-Toc h1 {
                     margin: inherit;
                     cursor: pointer;
                     font-size: 18px;
                 }
                 #LP5-Toc h2 {
                     text-indent: 5%;
                     margin: inherit;
                     cursor: pointer;
                     font-size: 15px;
                 }
                 #LP5-Toc h3 {
                     text-indent: 10%;
                     margin: inherit;
                     cursor: pointer;
                     font-size: 15px;
                 }
                 #LP5-Source{
                     background-color: #FFFFEB;
                     grid-area: source;
                     overflow: auto;
                     display: flex;
                     flex-flow: column;
                     /*             align-items: stretch; */
                 }
                 .LP5-Section{
                     border-bottom: 1px dotted  #a5c8ba;
                     padding-right: 5px;
                     padding-left: 5px;
                     background-color: #FFFFC9;
                     width: fit-content;
                     /*             width: auto;*/
                 }
                 .LP5-Code {
                     font-family: "Consolas", monospace;
                     white-space: pre;
                     background-color: #FFFFFF;
                     border-top:2px solid #FFFF00;
                     margin-left: -4px;
                     line-height: 100%;
                 }
                 .LP5-Code p {
                     margin: 0;
                 }
                 .LP5-Code-Unref {
                     background-color: #FFa0FF;
                     font-family: "Verdana", "Arial", Gadget, sans-serif;
                     white-space: normal;
                 }
                 .LP5-Code-Ref {
                     background-color: #FFFFEB;
                     font-family: "Verdana", "Arial", Gadget, sans-serif;
                     white-space: normal;
                 }
                 .LP5-CodeName {
                     font-family: "Arial", Gadget, sans-serif;
                     background-color: #F9FFF0;
                     word-wrap: break-word;
                     white-space: normal;
                 }
                 .LP5-CodeNameBrackets { font-family: monospace; }
                 .LP5-Comment{
                     /*             background-color: #FFFFEB; */
                 }
                 .LP5-Comment h1 {
                     margin: .2em 0 .2em 0;
                 }
                 .LP5-Comment h2 {
                     margin: .15em 0 .15em 0;
                 }
                 .LP5-Comment h3 {
                     margin: .1em 0 .1em 0;
                 }
                 #LP5-Output{
                     grid-area: output;
                     white-space: pre-line;
                 }
                 #LP5-Menu {
                     height:50px;
                     background:#d0d0d0;
                     border:1px solid #b9b9b9;
                     grid-area: menu;
                 }
                 #LP5-Menu ul {
                     display: flex;
                     align-items: center;
                     list-style: none;
                     background-color: #d0d0d0;
                     color: #11F;
                 }
                 #LP5-Menu li {
                     margin-left: 20px;
                     cursor: pointer;
                     transition: .5s;
                 }
                 #LP5-Menu li:hover {
                     color: red;
                 }
                </style>
                <div id="LP5-Menu">
                    <ul>
                        <li id="LP5-Menu-Compile">Compile</li>
                        <li>Menu 2</li>
                        <li>Menu 3</li>
                        <li>Menu 4</li>
                    </ul>
                </div>
                <div id="LP5-Toc">
                </div>
                <div id="LP5-Source">
                </div>
                <div id="LP5-Output">
                    Here be some output!
                    Code as it would be generated from the current source should appear here.
                </div>
                <div id="LP5-Footer">
                    Here's a footer! Maybe some kind of status info would go here.
                </div>
                <script>
                 (function(){
                     
                     return {
                         init(){
                             console.log("home page script init!!!!!!");
                             if(!LP5.dirParentHandle){
                                 //   LP5.views.push("SelectParent");
                                 setTimeout(()=>LP5.views.push('SelectParent'));
                             } else
                             if(LP5.model.projectName){
                                 const footer = document.body.querySelector('#LP5-Footer');
                                 footer.innerText = LP5.model.projectName;
                             }
                         },
                         change(){
                             console.log("home page script change!!!!!!");
                         }
                     };
                 })();
                </script>
            </div>
        </template>
        <!-- table of contents -->
        <template id="lp5-new-TOC" data-name="toc">

            <a href="SHA1">title override</a>
        </template>
        <script>

         "use strict";
         var LP5 = function(){
             const url = {
                 baseURL : null,
                 virtualURL : null,
                 init() {
                     //     window.history.replaceState(LP5.url, null, "");
                 },
             };
             async function modelLoad(name){
                 // ??? have to delete any existing model
                 console.log(`modelLoad('${name}')`);
                 console.assert(this.projects.hasOwnProperty(name));
                 const dirHandle = this.projects[name].dirHandle;
                 const rootName = name;
                 const fileHandle = await dirHandle.getFileHandle(name);
                 console.assert(fileHandle);
                 const file = await fileHandle.getFile();
                 console.log(`file = ${file}`);
                 const text = await file.text();
                 console.log(`text = ${text}`);
             }
             async function modelLoadFile(dirHandle, fileName){
                 const fileHandle = await dirHandle.getFileHandle(fileName);
                 console.assert(fileHandle);
                 const file = await fileHandle.getFile();
                 console.log(`file = ${file}`);
                 const text = await file.text();
                 console.log(`text = ${text}`);
                 return text;
             }
             const state = {
                 name: "initial",
                 entry(){
                     LP5.start();
                 }
             };
             let control = {
                 currentState: null,
                 states: {
                     initial: {
                         entry(){
                             for(const [key,value] of Object.entries(LP5.control.states)){
                                 value.name = key;
                             }
                             LP5.views.loadTemplates();
                             //                             LP5.control.goto('home');
                             LP5.control.queueNext('home');
                         }
                     },
                     // on the home page
                     home: {
                         entry(){
                             LP5.views.change('home');
                             if(!LP5.model.dirParentHandle){
                                 LP5.control.queueNext('selectParent');
                             }
                         }
                     },
                     // need to ask user to select parent dir
                     selectParent: {
                         entry(){
                             LP5.views.push('SelectParent');
                         },
                         next(event, target){
                             switch(target){
                                 case "click#SelectParentDir" :
                                     console.log("Click!!!!");
                                     if(!LP5.selectParentDir())
                                         LP5.control.goto('home');
                                     break;
                                 case "close#" :
                                     event.target.close();
                                     //                                     LP5.control.goto('home');
                                     LP5.control.queueNext('home');
                                     break;
                                 default:
                                     console.log("Can't handle this event.");
                                     return false;
                             }
                             return true;
                         },
                         exit(){
                             LP5.views.pop();
                         }
                     }
                 },
                 next(event){
                     const target = event.type + "#" + event.target.id;
                     console.log("control.next", target, event);
                     // if state didn't handle event
                     if(!LP5.control.currentState.next(event, target)){
                         if(target == "hashchange#undefined")
                             ;
                         else if(target.startsWith('click#')){
                             console.log("ignore click");
                         } else {
                             console.assert(false);
                         }
                     }
                 },
                 queueNext(stateName){
                     console.log(`queueNext('${stateName}')`);
                     setTimeout(()=>this.goto(stateName));
                 },
                 goto(stateName){
                     console.log(`control.goto("${stateName}")`);
                     let currentState = this.currentState;
                     if(currentState && currentState.hasOwnProperty('exit'))
                         currentState.exit();
                     currentState = this.currentState = this.states[stateName];
                     if(currentState && currentState.hasOwnProperty('entry'))
                         currentState.entry();
                 }
             };
             [
                 'click',
                 'close',
                 'hashchange',
             ].forEach(e=>document.addEventListener(e, control.next, true));

             // home page
             function*coHome(){
                 let event;

                 LP5.views.change('home');
                 // if we don't recall any project, have to ask user for one
                 if(!LP5.dirParentHandle){
                     event = yield 'coSelectParent';
                     console.log("Event from coSelectParent is ", event);
                 }
                 while(event=yield){
                     console.log("coHome gets ", event);
                 }
             }
             function*coSelectParent(){
                 LP5.views.push('SelectParent');
                 while(event = yield)
                     if(event){
                     }
             }
             const model = {
                 dirHandle       : null,
                 dirParentHandle : null,
                 projectName     : null,
                 toc             : null,
                 projects        : {},
                 load            : modelLoad,
             };
             // interface to a view
             const viewInterface = {
                 name         : "",
                 dialogNode   : null,
                 active       : false,
                 notify       : null,
                 rootNode     : null,
             };
             const views = {
                 views       : {},
                 eventTarget : new EventTarget(),
                 inProgress  : 0,
                 current     : null,
                 dialog      : null,
                 loadTemplates(){
                     console.log("views.loadTemplates()");
                     document.querySelectorAll('template').forEach((t)=>{
                         const iView    = structuredClone(viewInterface);
                         const name     = t.dataset.name;
                         iView.name     = name;
                         iView.rootNode = t.content.firstElementChild.cloneNode(true);
                         iView.dialogNode   = iView.rootNode.querySelector('dialog');
                         // Removing the open attribute will usually hide the dialog.
                         // However, doing so has a number of strange additional consequences:
                         // https://html.spec.whatwg.org/multipage/interactive-elements.html#the-dialog-element
                         // on 08/23/2022
                         if(iView.dialogNode)
                             console.assert(typeof iView.dialogNode.close === 'function');
                         const script   = t.content.querySelector('script');
                         if(script){
                             // remove script else it will run when frag inserted into DOM
                             script.remove();
                             // run the script to obtain its notification functions
                             iView.notify   = eval(script.innerHTML);
                             console.assert(iView.notify.hasOwnProperty('init'));
                             console.assert(iView.notify.hasOwnProperty('change'));
                         }
                         // two templates with same name is a mistake
                         console.assert(!LP5.views.views.hasOwnProperty(name));
                         LP5.views.views[iView.name] = iView;
                     });

                     // known starting place must be defined
                     console.assert(LP5.views.views.hasOwnProperty('home'));
                 },
                 notifyChange(eventName){
                     //                     eventTarget.dispatchEvent(
                 },
                 exists(viewName) {
                     return this.views.hasOwnProperty(viewName);
                 },
                 change(viewName) {
                     console.log(`views.change(${viewName})`);
                     ++this.inProgress;
                     // get interface to incoming view
                     const iView = this.views[viewName];
                     this.current = iView;
                     console.assert(this.current);
                     LP5.setBody(iView);
                     --this.inProgress;
                     this.current.notify.init();
                 },
                 push(dialogName) {
                     console.assert(this.current);
                     ++this.inProgress;
                     const iView = this.views[dialogName];
                     this.dialog = iView;
                     LP5.setBody(iView);
                     --this.inProgress;
                 },
                 pop() {
                     console.assert(this.dialog);
                     console.assert(this.current);
                     console.log("pop() this.current = ", this.current);
                     ++this.inProgress;
                     console.log(this.dialog.dialogNode);
                     console.log(this.dialog.dialogNode.close);
                     this.dialog.dialogNode.close('pop closes dialog');
                     console.log("pop() closes dialog");
                     this.dialog.dialogNode.remove();
                     this.dialog = null;
                     //                     LP5.setBody(this.current);
                     //                     this.current.notify.init();
                     --this.inProgress;
                 },
                 onHashChange(event){
                     console.log("onHashChange(): ", event);
                     // newHash = everything after '#'
                     let newHash = event.newURL.replace(/^[^#]*#/, '');
                     // newPage = everthing after '#' and before any '/'
                     let newPage = newHash.replace(/^([^/]+).*/, '$1');
                     console.log("newHash = ", newHash, "newPage = ", newPage);
                     //                 location.replace("#"+newHash);
                     //                 LP5.setBody(newHash);
                     if(!LP5.views.exists(newPage)){
                         alert(`unknown URL: ${newPage}`);
                         history.back();
                     }
                     else if(LP5.views.inProgress <= 0)
                         LP5.views.change(newPage);
                 }
             };
             var result = {
                 control         : control,
                 model           : model,
                 views           : views,
                 currentTemplate : null,
                 templates       : {},
                 dirHandle       : null,
                 dirParentHandle : null,
                 dbHandle        : null,
                 url             : url,
             };
             result.pageState = (function * (){
                 let state    = null;
                 let newState = null;
                 while((newState=yield))
                     switch(newState){
                         case '':
                             break;
                     }
             })();
             result.test = function(){
                 console.log("test!");
                 try {
                     location.hash = "lp5-select-parent";
                     //                     LP5.storeBlob("this is a test");
                 } catch(err) {
                     console.log("Error: ", err);
                 }
             }
             // storeBlob() - store data in a blob, return name (SHA256)
             result.storeBlob = async function(string){
                 console.assert(LP5.dirHandle);
                 let encoder = new TextEncoder();
                 let data    = encoder.encode(string);
                 let hash    = await window.crypto.subtle.digest('SHA-256', data);
                 
                 console.log("hash is: ", hash);
                 hash = btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\//g, '_').replace(/\+/g, '-').replace(/=/g, '');
                 console.log("hash[", hash.length, "] is now: ", hash);
             }

             result.start = function(){
                 console.log("LP5.start: location is ", window.location.href);
                 
                 if(false){
                     let templates = document.querySelectorAll("template");
                     console.log(templates);
                     for(const t of templates){
                         const io    = structuredClone(viewInterface);
                         const name  = t.dataset.name;
                         io.rootNode = t.content.firstElementChild.cloneNode(true);
                         //                     const click = io.rootNode.attributes['onclick'];
                         
                         const click = io.rootNode.getAttribute('onclick');
                         if(click){
                             console.log("typeof(io.rootNode) = ", typeof(click));
                             console.log("io.rootNode = ", click);
                             //                     io.rootNode.attributes['onclick']();
                             console.log("   ", Object.keys(click));
                             console.log("onclick = ", io.rootNode.onclick);
                         }
                         const script = t.content.querySelector("script");
                         if(script && name == 'home'){
                             script.remove();
                             console.log(`script = ${script}`);
                             const val = eval(script.innerHTML);
                             console.log (` returns ${val}`);
                             console.log(`val.retval = ${JSON.stringify(val)}`);
                             console.log(`typeof(val)=${typeof(val)}`);
                             console.log("==>", Object.keys(val));
                             console.log("retval is ", val.retval);
                         }
                     }

                     if(false){
                         // create index of all the "pages" (templates) we use
                         templates = document.querySelectorAll("template");
                         console.log(templates);
                         for(const t of templates){
                             LP5.templates[t.dataset.name] =
                                 t.content.firstElementChild.cloneNode(true);
                         }
                     }
                 }
                 // go to initial page
                 //                 this.setBody("SelectParent");
                 //                 window.location.hash = "home";
                 //                 LP5.views.change("home");
             }
             result.selectParentDir = async function(){
                 const model = LP5.model;
                 console.log(this);
                 let options = {mode:'readwrite'};
                 try {
                     model.dirParentHandle = await window.showDirectoryPicker(options);
                 } catch (error) {
                     console.log(error);
                     return false;
                 }
                 if(model.dirParentHandle){
                     console.log(model.dirParentHandle);
                     let projectCount = 0;
                     for await (let [name, handle] of model.dirParentHandle) {
                         if(name.endsWith('.lp5') && handle.kind == 'directory'){
                             console.log("looks like a project: ", handle);
                             model.projects[name] = { dirHandle: handle };
                             model.projectName = name;
                             ++projectCount;
                         }
                     }
                     console.log(`projectCount = ${projectCount}`);
                     if(projectCount != 1){
                         LP5.setBody("lp5-enter-dir-name");
                     } else {
                         document.title = model.projectName;
                         await model.load(model.projectName);
                         //                         LP5.views.change("home");
                     }
                 }
                 //                 LP5.views.pop();
                 console.log("<= selectParentDir returns");
                 return false;
             }
             result.createProject = async function (button){
                 console.log("Create Project!");
                 console.log(this);
                 let textBox = document.querySelector("#lp5InputFile");
                 let dirName = textBox.value;
                 if(!dirName.endsWith('lp5')){
                     alert("lp5 project directory name must end with '.lp5'");
                 } else {
                     let options = {create:true};
                     try {
                         LP5.lp5DirHandle = await LP5.dirParentHandle.getDirectoryHandle(dirName, options);
                     } catch (error) {
                         LP5.setBody("lp5-start-form");
                         return;
                     }
                     console.log(LP5.lp5DirHandle);
                     console.log("Created a directory!");
                     // create a TOC resource
                     let newTOC = LP5.templates["lp5-new-TOC"].cloneNode(true);
                     console.log("newTOC is: ", newTOC);
                     let elem   = newTOC.querySelector("li");
                     elem.innerText = dirName;
                     let strTOC = newTOC.innerHTML;
                     console.log("strTOC is: ", strTOC);
                     let fileHandle = await LP5.lp5DirHandle.getFileHandle(dirName,{create:true});
                     let writable  = await fileHandle.createWritable();
                     options = {type:"write", data: strTOC};
                     await writable.write(options);
                     await writable.close();
                     LP5.setBody("lp5-main-page");
                 }
             }
             result.cancelNewProject = function(){
                 console.log("cancelNewProject()");
                 LP5.setBody("lp5-start-form");
             }
             result.create = async function(){
                 console.log(this);
                 let options = {mode:'readwrite'};
                 try {

                     LP5.dirParentHandle = await window.showDirectoryPicker(options);
                 } catch (error) {
                     console.log(error);
                     return;
                 }
                 if(LP5.dirParentHandle){
                     console.log(options);
                     console.log(LP5.dirParentHandle);
                     LP5.setBody("lp5-enter-dir-name");
                 }
             }
             // LP5.open - open an existing project
             result.open = async function(){
                 let fileHandle;
                 [fileHandle] = await window.showOpenFilePicker({multiple:false});
                 const file   = await fileHandle.getFile();
                 const data   = await file.text();
                 console.log(data);
             }
             result.newSection = async function (){
                 let newID    = crypto.randomUUID();
                 console.log("New Section " + newID);
                 return false;
             }
             result.setBody = function (iView){
                 //                 console.assert(false);
                 const name = iView.name;
                 console.log(`setBody(${name})`);
                 history.pushState(null, "", "#" + name);
                 //                 location.hash = name;
                 console.log(`history.pushState("#${name}")`);

                 const template = iView.rootNode.cloneNode(true);
                 console.log("back from cloneNode of template");
                 let dialog = template.querySelector("dialog");
                 if(dialog){
                     document.body.prepend(template);
                     dialog.showModal();
                 } else {
                     // if we are popping a dialog
                     if(LP5.views.dialog){
                     }
                     console.log("before replaceChildren");
                     document.body.replaceChildren(template);
                     console.log("after replaceChildren");
                     /* if not showing dialog, autofocus only valid on page load,
                      * so fix that manually.
                      * https://html.spec.whatwg.org/multipage/interaction.html#the-autofocus-attribute
                      */
                     let focus = document.body.querySelector("input[autofocus]");
                     if(focus)
                         focus.focus();
                 }
                 LP5.currentTemplate = name;
             }
             result.exists = function(name){
                 console.assert(this.dirHandle);
                 
             }
             return result;
         }();
         LP5.url.init();
         LP5.control.goto('initial');
        </script>
    </body>
</html>
