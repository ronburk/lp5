        <script>

         "use strict";
         var LP5 = function(){

             async function*main(model, views){
                 let selectParentDir=async function*(){
                     console.log("selectParentDir: ", model, views);
                     let result = false; // assume failure
                     views.push('SelectParent');
                     while(event = yield){
                         console.log("SelectParent got event ", typeof(event));
                         console.log(event);
                         if(event.target.id == "SelectParentDirButton"){
                             console.log(this);
                             let options = {mode:'readwrite'};
                             try {
                                 model.dirParentHandle = await window.showDirectoryPicker(options);
                             } catch (error) {
                                 console.log(error);
                                 return false;
                             }
                             if(model.dirParentHandle){
                                 console.log(model.dirParentHandle);
                                 let projectCount = 0;
                                 for await (let [name, handle] of model.dirParentHandle) {
                                     if(name.endsWith('.lp5') && handle.kind == 'directory'){
                                         console.log("looks like a project: ", handle);
                                         model.projects[name] = { dirHandle: handle };
                                         model.projectName = name;
                                         ++projectCount;
                                     }
                                 }
                                 console.log(`projectCount = ${projectCount}`);
                                 if(projectCount != 1){
                                     LP5.setBody("lp5-enter-dir-name");
                                 } else {
                                     document.title = model.projectName;
                                     await model.load(model.projectName);
                                 }
                             }
                             if(model.dirParentHandle){
                                 console.log("coSelectParent got a dirParentHandle");
                                 result = true;
                                 break;
                             }
                         } else if(event.type == 'close'){
                             console.log("select parent got close.");
                             break;
                         }
                         console.log("selectParentDir got event: ", event);
                     }
                     views.pop();
                     return result;
                 };
                 let tocPane = async function*(model, views){
                     
                 };

                 console.log("main: ", model, views);
                 views.change('home');

                 if(!model.dirParentHandle){
                     let value = yield* selectParentDir(model, views);
                     console.log("selectParentDir returned: ", value);
                 }
                 console.log("main enters event loop");
                 while(event = yield){
                     console.log("main got event: ", event);
                 }
             };

             async function modelLoadFile(dirHandle, fileName){
                 const fileHandle = await dirHandle.getFileHandle(fileName);
                 console.assert(fileHandle);
                 const file = await fileHandle.getFile();
                 console.log(`file = ${file}`);
                 const text = await file.text();
                 console.log(`text = ${text}`);
                 return text;
             }
             var result = {
                 //                 model           : model,
                 //                 views           : views,
                 currentTemplate : null,
                 templates       : {},
                 dirHandle       : null,
                 dirParentHandle : null,
                 dbHandle        : null,
             };

             result.test = function(){
                 console.log("test!");
                 try {
                     location.hash = "lp5-select-parent";
                     //                     LP5.storeBlob("this is a test");
                 } catch(err) {
                     console.log("Error: ", err);
                 }
             };
             // storeBlob() - store data in a blob, return name (SHA256)
             result.storeBlob = async function(string){
                 console.assert(LP5.dirHandle);
                 let encoder = new TextEncoder();
                 let data    = encoder.encode(string);
                 let hash    = await window.crypto.subtle.digest('SHA-256', data);
                 
                 console.log("hash is: ", hash);
                 hash = btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\//g, '_').replace(/\+/g, '-').replace(/=/g, '');
                 console.log("hash[", hash.length, "] is now: ", hash);
             };

             result.createProject = async function (button){
                 console.log("Create Project!");
                 console.log(this);
                 let textBox = document.querySelector("#lp5InputFile");
                 let dirName = textBox.value;
                 if(!dirName.endsWith('lp5')){
                     alert("lp5 project directory name must end with '.lp5'");
                 } else {
                     let options = {create:true};
                     try {
                         LP5.lp5DirHandle = await LP5.dirParentHandle.getDirectoryHandle(dirName, options);
                     } catch (error) {
                         LP5.setBody("lp5-start-form");
                         return;
                     }
                     console.log(LP5.lp5DirHandle);
                     console.log("Created a directory!");
                     // create a TOC resource
                     let newTOC = LP5.templates["lp5-new-TOC"].cloneNode(true);
                     console.log("newTOC is: ", newTOC);
                     let elem   = newTOC.querySelector("li");
                     elem.innerText = dirName;
                     let strTOC = newTOC.innerHTML;
                     console.log("strTOC is: ", strTOC);
                     let fileHandle = await LP5.lp5DirHandle.getFileHandle(dirName,{create:true});
                     let writable  = await fileHandle.createWritable();
                     options = {type:"write", data: strTOC};
                     await writable.write(options);
                     await writable.close();
                     LP5.setBody("lp5-main-page");
                 }
             }
             result.cancelNewProject = function(){
                 console.log("cancelNewProject()");
                 LP5.setBody("lp5-start-form");
             }
             result.create = async function(){
                 console.log(this);
                 let options = {mode:'readwrite'};
                 try {

                     LP5.dirParentHandle = await window.showDirectoryPicker(options);
                 } catch (error) {
                     console.log(error);
                     return;
                 }
                 if(LP5.dirParentHandle){
                     console.log(options);
                     console.log(LP5.dirParentHandle);
                     LP5.setBody("lp5-enter-dir-name");
                 }
             }
             // LP5.open - open an existing project
             result.open = async function(){
                 let fileHandle;
                 [fileHandle] = await window.showOpenFilePicker({multiple:false});
                 const file   = await fileHandle.getFile();
                 const data   = await file.text();
                 console.log(data);
             }
             result.newSection = async function (){
                 let newID    = crypto.randomUUID();
                 console.log("New Section " + newID);
                 return false;
             }
             result.setBody = function (iView){
                 //                 console.assert(false);
                 const name = iView.name;
                 console.log(`setBody(${name})`);
                 history.pushState(null, "", "#" + name);
                 //                 location.hash = name;
                 console.log(`history.pushState("#${name}")`);

                 const template = iView.rootNode.cloneNode(true);
                 console.log("back from cloneNode of template");
                 let dialog = template.querySelector("dialog");
                 if(dialog){
                     document.body.prepend(template);
                     dialog.showModal();
                 } else {
                     console.log("before replaceChildren");
                     document.body.replaceChildren(template);
                     console.log("after replaceChildren");
                     /* if not showing dialog, autofocus only valid on page load,
                      * so fix that manually.
                      * https://html.spec.whatwg.org/multipage/interaction.html#the-autofocus-attribute
                      */
                     let focus = document.body.querySelector("input[autofocus]");
                     if(focus)
                         focus.focus();
                 }
                 LP5.currentTemplate = name;
             }
             result.exists = function(name){
                 console.assert(this.dirHandle);
                 
             }
             result.main = main;
             return result;
         }();

         async function selectParentDir(model, asyncComplete){
             console.log("selectParentDir()");

             let options = {mode:'readwrite'};
             try {
                 model.dirParentHandle = await window.showDirectoryPicker(options);
             } catch (error) {
                 //
                 console.log(typeof error);
                 console.log(error);
             } finally {
                 if(!model.dirParentHandle){
                     asyncComplete(false);
                     console.log("selectParentDir() returns early");
                     return;
                 }                     
             }
             console.assert(model.dirParentHandle);
             // now we have a handle to the parent directory
             try {
                 console.log(model.dirParentHandle);
                 let projectCount = 0;
                 for await (let [name, handle] of model.dirParentHandle) {
                     if(name.endsWith('.lp5') && handle.kind == 'directory'){
                         console.log("looks like a project: ", handle);
                         model.projects[name] = { dirHandle: handle };
                         model.projectName = name;
                         ++projectCount;
                     }
                 }
             } catch(error) {
                 console.log("What is this error? Filesystem problem?");
                 console.log(error);
                 asyncComplete(false);
                 return;
             }
             if(model.dirParentHandle){
                 console.log("coSelectParent got a dirParentHandle");
             }
             console.log("selectParentDir() returns");
             asyncComplete(true);
         }

         function controller(event){
             const { model, views, asyncSchedule } = controller;
             const currentViewName = views.currentView
                                   ? views.currentView.name : "";

             console.log(">>>>>>>>>>>>>>>>>>>>>>>>>enter controller ", controller.state);
             console.log(event);
             console.assert(!controller.inSync);
             controller.inSync = true;
             switch(controller.state){
                 case 'load' :
                     console.assert(event.type == 'load', event);
                     views.loadTemplates();
                     views.change('home');
                     views.push('SelectParent');
                     controller.state = 'SelectParent';
                     break;
                 case 'SelectParent' :
                     console.assert(currentViewName == 'SelectParent', currentViewName);
                     if(event.target.id == "SelectParentDirButton"){
                         console.assert(event.type == 'click');
                         console.log(">>>>>>>>>>>>>asyncSchedule!!!!!!");
                         asyncSchedule(selectParentDir, model);
                         console.log("<<<<<<<<<<<<<asyncSchedule!!!!!!");
                         controller.state = 'SelectingParent';
                     } else if(event.type == 'close') {
                         console.log("Clse event came in");
                     } else {
                         console.assert(false, event);
                     }
                     break;
                 case 'SelectingParent':
                     if(event.type == 'hashchange'){
                         controller.state = 'SelectingParentHashChanged';
                         controller.oldURL = event.oldURL;
                     } else {
                         console.assert(event.type == 'asyncComplete', event);
                         views.pop();
                         if(event.detail){
                             console.assert(model.dirParentHandle);
                             controller.state = 'PickOrCreateProject';
                             views.push('PickOrCreateProject');
                         } else {
                             views.push('SelectParent');
                             controller.state = 'SelectParent';
                         }
                     }
                     break;
                 // unusual case where user changed hash while sysdialog was up
                 case 'SelectingParentHashChanged' :
                     console.assert(event.type == 'asyncComplete');
                     window.location = controller.oldURL;
                     views.pop();
                     views.push('SelectParent');
                     controller.state = 'SelectParent';
                     break;
                 case 'PickOrCreateProject' :
                     console.log(event);
                     // let current view handle event
                     break;
                 default:
                     console.log("Can't happen, unknown state: ", controller.state);
                     console.assert(false);
             }
             controller.inSync = false;
             console.log("<<<<<<<<<<<<<<<<<<<<<<<<<exit controller: ", controller.state);
         }
         [
             'asyncComplete',
             'change',
             'click',
             'close',
             'hashchange',
             'input',
             'load',
             'selectProject',
         ].forEach(e=>window.addEventListener(e, e=>controller(e), true));

         //             window.onload = controller;

         controller.asyncSchedule = function(func, ...args){
             setTimeout(()=>func(...args, controller.asyncComplete));
         }
         controller.asyncComplete = function(value){
             function f() {
                 console.log("inside asyncComplete");
                 document.dispatchEvent(
                     new CustomEvent('asyncComplete', { detail:value}));
             }
             setTimeout(f);
         };
         controller.states = new Set([
             'load',
             'SelectParent',
             'SelectingParent',
             'SelectingParentHashChanged',
             'PickOrCreateProject',
             'main'
         ]);
         Object.defineProperty(controller, 'state', {
             get() { return controller.state_; },
             set(val) {
                 console.assert(controller.states.has(val));
                 controller.state_ = val;
             }
         });
         
         controller.inSync = false;
         controller.state  = 'load';

         function scopedEval(script, iView){
             for(const element of iView.rootNode.querySelectorAll("[data-ID]"))
                 iView.dataID[element.dataset.id] = element;

             function require(thing){
                 switch(thing){
                     case 'controller':
                         return controller;
                     case 'model':
                         return controller.model;
                     case 'views' :
                         return controller.views;
                     case 'iView':
                         return iView;
                     default:
                         console.assert(false);
                 }
             }
             return new Function("require", '"use strict";' + script)(require);
         }

         // interface to a view
         const viewInterface = {
             name         : "",
             isDialog     : false,
             notify       : null,
             children     : [],
             rootNode     : null,
             dataID       : {},
         };
         controller.views = {
             views       : {},
             listeners   : {},
             stack       : [],
             inProgress  : 0,
             currentView : null,
             notifyModelChange(info){
                 Object.keys(listeners).forEach(
                     function(k){
                         const func = listeners[k].notify;
                         if(func)
                             func(info);
                     }
                 );
             },
             loadTemplates(rootElement=document, parentView=null){
                 console.log("views.loadTemplates()");
                 rootElement.querySelectorAll('template').forEach((t)=>{
                     const iView    = structuredClone(viewInterface);
                     iView.name     = t.dataset.name; // data-name='xxx'
                     console.log("template named ", iView.name);

                     // we assume everything is in one enclosing div
                     console.assert(t.content.childElementCount == 1);
                     const templateRoot = t.content.firstElementChild;
                     console.assert(templateRoot.nodeName == "DIV");
                     
                     if(parentView){
                         iView.rootNode = templateRoot;
                         t.replaceWith(templateRoot);
                     } else {
                         // clone template, then discard it
                         iView.rootNode = templateRoot.cloneNode(true);
                         t.remove();
                         const dialogNode = iView.rootNode.querySelector('dialog');
                         if(dialogNode){
                             iView.isDialog = true;
                             // do not define dialog 'open' attribute, please
                             console.assert(!dialogNode.hasAttribute('open'));
                         }
                     }


                     // Removing the open attribute will usually hide the dialog.
                     // However, doing so has strange additional consequences:
                     // https://html.spec.whatwg.org/multipage/interactive-elements.html#the-dialog-element
                     const script   = iView.rootNode.querySelector('script');
                     if(script){
                         // remove script else it will run when frag inserted into DOM
                         script.remove();
                         // run the script to obtain its notification functions
                         iView.notify   = scopedEval(script.innerHTML, iView);
                         console.assert(iView.notify.hasOwnProperty('init'));
                         console.assert(iView.notify.hasOwnProperty('render'));
                     }
                     // two templates with same name is a mistake
                     //                         console.assert(!LP5.views.views.hasOwnProperty(iView.name));
                     console.assert(!this.views.hasOwnProperty(iView.name));

                     if(!parentView){ // if this is an outermost template
                         // recurse to handle any nested children
                         this.loadTemplates(iView.rootNode, iView);
                         this.views[iView.name] = iView;
                     } else {
                         parentView.children.push(iView);
                     }

                 });

                 if(!parentView){
                     // known starting view must be defined
                     console.assert(this.views.hasOwnProperty('home'));
                 }
             },
             notifyChange(eventName){
                 //                     eventTarget.dispatchEvent(
             },
             exists(viewName) {
                 return this.views.hasOwnProperty(viewName);
             },
             change(viewName) {
                 console.log(`views.change(${viewName})`);
                     ++this.inProgress;
                 // get interface to incoming view
                 const newView = this.views[viewName];
 //                 this.currentView = this.views[viewName];
//                 console.assert(this.currentView);
                 console.assert(newView);
                 this.setBody(newView);
                 --this.inProgress;
                 //                 this.currentView.notify.init();
                 this.init(this.currentView);
             },
             init(iView){
                 iView.notify.init(iView);
                 iView.children.forEach((i)=>i.notify.init(iView));
             },
             push(dialogName) {
                 ++this.inProgress;
                 console.assert(this.currentView);
                 this.stack.push(this.currentView);
                 const iView = this.views[dialogName];
                 this.setBody(iView);
                 this.currentView = iView;
                 this.init(this.currentView);
                 --this.inProgress;
             },
             pop() {
                 ++this.inProgress;
                 const currentView = this.currentView;
                 console.assert(currentView.isDialog);
                 console.assert(currentView);
                 console.log("pop() this.current = ", currentView);
                 // our root is a div containing a dialog
                 const liveRootNode   = document.body.firstElementChild;
                 const liveDialogNode = liveRootNode.querySelector("dialog");
                 console.assert(liveDialogNode.nodeName == "DIALOG");
                 liveDialogNode.close();
                 console.log("pop() closes dialog");
//                 currentView.rootNode.replaceChildren(liveRootNode);
                 liveRootNode.remove();
                 this.currentView = this.stack.pop();
                 --this.inProgress;
             },
             onHashChange(event){
                 console.log("onHashChange(): ", event);
                 // newHash = everything after '#'
                 let newHash = event.newURL.replace(/^[^#]*#/, '');
                 // newPage = everthing after '#' and before any '/'
                 let newPage = newHash.replace(/^([^/]+).*/, '$1');
                 console.log("newHash = ", newHash, "newPage = ", newPage);
                 //                 location.replace("#"+newHash);
                 //                 LP5.setBody(newHash);
                 if(!LP5.views.exists(newPage)){
                     alert(`unknown URL: ${newPage}`);
                     history.back();
                 }
                 else if(LP5.views.inProgress <= 0)
                     LP5.views.change(newPage);
             },
             setBody(iView){
                 const {name}      = iView;
                 const currentView = this.currentView;
                 const body        = document.body;

                 console.log(`setBody(${name})`);
                 history.pushState(null, "", "#" + name);
                 console.log(`history.pushState("#${name}")`);
                 // give current view back its nodes
                 // this only happens when change()ing one non-dialog to another
                 if(currentView && !iView.isDialog){
                     currentView.rootNode.replaceChildren(body.firstElementChild);
                 }

                             //???                 const template = iView.rootNode.cloneNode(true);
                 const template = iView.rootNode;
                 let dialog = template.querySelector("dialog");
                 if(dialog){
                     if(false){
                         const div = body.createElement("div");
                         body.prepend(div);
                         body.firstElementChild.replaceChildren(template);
                     }
                     body.prepend(template);
                     dialog.showModal();
                 } else {
                     document.body.replaceChildren(template);
                     /* if not showing dialog, autofocus only valid on page load,
                      * so fix that manually.
                      * https://html.spec.whatwg.org/multipage/interaction.html#the-autofocus-attribute
                      */
                     let focus = document.body.querySelector("input[autofocus]");
                     if(focus)
                         focus.focus();
                 }
                 this.currentView = iView;
             }
         };
