<script type="text/state-machine" id="lp5StateMachine">
        const {asyncSchedule} = window.LP5.modSchedule;
        const {views, model}  = window.LP5;
        function openArticleEditor(url){
            const article = model.articleFromURL(url);
            if(!article)
                throw new Error(`Article not found: ${url}`);
            const editor = document.createElement('lp5-editarticle');
            editor.setArticle(article);
            document.body.append(editor);
        }
state load
        views.loadTemplates();
        views.change('home');
        views.popup('lp5-selectorcreate');
    ->  selectOrCreateProject

state selectOrCreateProject
    on  lp5SelectProject
        const selection = event.detail;
        asyncSchedule(() => selection);
    ->  awaitProjectPicker
    on  lp5CreateProject
        views.popup('lp5-createproject');

state awaitProjectPicker
    on  lp5AsyncComplete
        const {name, error} = event.detail;
        if(error) {
            console.error('Directory picker failed:', error);
            views.dialog.shadowRoot.querySelector('[data-name="selectionError"]').textContent =
                `Could not select project: ${error.name}: ${error.message}`;
    ->      selectOrCreateProject
        }
        asyncSchedule(model.openProject.bind(model), name);
    ->  awaitProjectLoad

state awaitProjectLoad
    on  lp5AsyncComplete
        model.updateDerivedState();
        views.close();
        views.render();
    ->  home

state home
    on  click
        if(event.ctrlKey && event.shiftKey) {
            const articleNode = event.composedPath().find((node, index, path) =>
                node.tagName === 'ARTICLE'
                && index + 1 < path.length
                && path[index + 1].id === 'LP5-Source');
            if(articleNode) {
                event.preventDefault();
                openArticleEditor(articleNode.id);
                -> editingArticle
            }
        }
    -> home

    on  lp5EditArticle
        openArticleEditor(event.detail);
    -> editingArticle

state editingArticle
    on  lp5DialogSave
        const editor = event.detail;
        const revision = editor.getArticleRevision();
        asyncSchedule(async () => {
            await model.storeResource2(revision.URL, revision.toString());
            await model.openProject(model.projectName);
            model.updateDerivedState();
            views.render();
            editor.closeEditor();
        });
    -> awaitArticleSave
    on  lp5DialogCancel
        event.detail.closeEditor();
    -> home

state awaitArticleSave
    on  lp5AsyncComplete
    -> home
        </script>

         window.LP5.modString = (function(){
             function getIndent(line){
                 let indent = -1;
                 line = line.replace(/\s+$/,'');
                 if(line.length > 0)
                     indent = line.search(/\S|$/);
                 return indent;
             }
             function unindent(text, moreIndent=0){
                 let result = text;
                 if(text){
                     // remove leading empty lines & trailing space, ensure final '\n'
                     text = text.replace(/^\s*[\r\n]+/,'');
                     text = text.replace(/\s*$/,'') + '\n';
                     let lines = text.split(/\r?\n/);
                     let minIndent = -1;
                     for(let line of lines){
                         let thisIndent = getIndent(line);
                         if(minIndent == -1 || thisIndent < minIndent)
                             minIndent = thisIndent;
                     }
                     if(minIndent > 0){
                         let space = " ".repeat(minIndent);
                         let regex = new RegExp("^" + space, 'gm');
                         result = text.replace(regex, '');
                         console.assert(result != text);
                     } else
                         result = text;
                     if(moreIndent > 0){
                         let space = " ".repeat(moreIndent);
                         let regex = /^(?=\S)/gm;
                         result = result.replace(regex, space);
                     }
                 }
                 console.error("unindent returns", result);
                 return result;
             }
             return {unindent, getIndent};
         })();
         window.LP5.modSchedule = (function(){
             function asyncSchedule(func, ...args){
                 function createErrorEvent(error) {
                     return new ErrorEvent('error', {
                         error: error,
                         message: error.message,
                         filename: document.location.href,  // You can use the current file URL
                         lineno: 1,  // Adjust based on your error location
                         colno: 1    // Adjust based on your error location
                     });
                 }

                 async function notifyWhenDone(){
                     try {
                         asyncComplete(await func(...args));
                     }catch(err){
                         console.error(err);
                         asyncComplete(createErrorEvent(err));
                     }
                 }
                 setTimeout(notifyWhenDone);
             }
             function asyncComplete(value){
                 console.log("inside asyncComplete, value is", value);
                 queueMicrotask(
                     function controller_asyncComplete() {
                         let event = null;
                         if(value instanceof Event)
                             event = value;
                         else
                             event = new CustomEvent('lp5AsyncComplete', { detail:value});
                         document.dispatchEvent(event);
                 });
                 console.log("exit asyncComplete");
             };
             return { asyncSchedule, asyncComplete };
         }());

        <script>

         window.LP5.modIndexedDB = (function(){
             const DB_NAME = "lp5-001";
             const STORE_NAME = "handles";
             const VERSION = 2;

             let dbPromise = null;

             function openDB() {
                 if (dbPromise) return dbPromise;
                 dbPromise = new Promise((resolve, reject) => {
                     const request = indexedDB.open(DB_NAME, VERSION);

                     request.onupgradeneeded = (event) => {
                         const db = event.target.result;
                         if (db.objectStoreNames.contains(STORE_NAME)) {
                             db.deleteObjectStore(STORE_NAME);
                         }
                         db.createObjectStore(STORE_NAME);
                     };

                     request.onsuccess = () => resolve(request.result);
                     request.onerror = (e) => reject(wrapError("open", null, "DB open failed", e.target.error));
                 });

                 return dbPromise;
             }

             function wrapError(op, key, message, cause) {
                 return { op, key, message, cause };
             }

             async function put(key, value) {
                 try {
                     const db = await openDB();
                     return await new Promise((resolve, reject) => {
                         const store = db.transaction([STORE_NAME], "readwrite").objectStore(STORE_NAME);
                         const req = store.put(value, key);
                         req.onsuccess = () => resolve();
                         req.onerror = (e) => reject(wrapError("put", key, "DB write failed", e.target.error));
                     });
                 } catch (e) {
                     if (e.op) throw e;
                     throw wrapError("put", key, "Unexpected failure", e);
                 }
             }

             async function get(key) {
                 try {
                     const db = await openDB();
                     return await new Promise((resolve, reject) => {
                         const store = db.transaction([STORE_NAME], "readonly").objectStore(STORE_NAME);
                         const req = store.get(key);
                         req.onsuccess = () => resolve(req.result);
                         req.onerror = (e) => reject(wrapError("get", key, "DB read failed", e.target.error));
                     });
                 } catch (e) {
                     if (e.op) throw e;
                     throw wrapError("get", key, "Unexpected failure", e);
                 }
             }

             return { get, put };
         })();

        <script>
         window.LP5.eggGlobals = {
             Article:        null,
             controller:     null,
             elementFoundry: null,
             eggFromTemplate:null,
             model:          null,
             scopedEval:     null,

         const originalAssert = console.assert;
         console.assert = function(condition, message, ...optionalParams) {
             if (!condition) {
                 originalAssert(condition, message, ...optionalParams);
                 throw new Error(message);
             }
         };
         window.assert = console.assert;

         window.lp5 = {};

         window.LP5.eggGlobals.elementFoundry = new Proxy({}, {
             get(target, prop) {return document.createElement(prop);}
         });

         window.LP5.eggGlobals.scopedEval = function(script, scriptName, scriptThis){
             const controller = window.LP5.eggGlobals.controller;
             let sourceMap = `\n//# sourceURL=${scriptName}\n`;
             console.log("before scopedEval4 return");
             controller.script = script;
             controller.scriptName = scriptName;
             const result = new Function(
                 '"use strict";' + script + sourceMap).call(scriptThis);
             controller.script = null;
             return result;
         }


         /* Egg.instance(template)
          *     - parse into egg
          *     - bind names
          *     - instance = scopedEval()
          *     - bind instance events
          * Egg.factory(template)
          *     - parse into egg
          *     - class = scopedEval()
          *     - class.constructor()
          *         - egg.clone(this)
          */

         window.LP5.Egg = class Egg {
             clone(){
                 const eggClone = { ...this };
                 eggClone.children = this.children.map(node => node.cloneNode(true));
                 this.#bindNames(eggClone);
                 this.#bindEvents(eggClone);
                 return eggClone;
             }
             template   = null;
             style      = null;
             script     = null;
             object     = null;
             children   = [];
             namedNodes = {};
//             globals    = window.LP5.eggGlobals;
             #parseTemplate(template){
                 for (const node of template.content.children)
                     switch (node.tagName) {
                         case 'STYLE':  this.style = node;        break;
                         case 'SCRIPT': this.script = node;       break;
                         default:       this.children.push(node); break;
                     }
             }
             static #scopedEval(script, scriptName, scriptThis){
                 const {controller} = window.LP5;
                 let sourceMap = `\n//# sourceURL=${scriptName}\n`;
                 console.log("before scopedEval4 return");
                 controller.script = script;
                 controller.scriptName = scriptName;
                 const result = new Function(
                     '"use strict";' + script.innerText + sourceMap).call(scriptThis);
                 controller.script = null;
                 return result;
             }

             #bindNames(egg){
                 const autoNamedNodes = {};
                 const walk = (node) => {
                     if (node.nodeType == Node.ELEMENT_NODE) {
                         const name = node.getAttribute('data-name');
                         if (name)
                             egg.namedNodes[name] = node;
                         else
                             autoNamedNodes[node.tagName.toLowerCase()] ??= node;
                         for (const child of node.children) walk(child);
                     }
                 };
                 for (const node of egg.children)  walk(node);
                 Object.setPrototypeOf(egg.namedNodes, autoNamedNodes);
             }
             #bindEvents(egg){
                 console.error("#bindEvents egg=", egg);
                 const walk = (node) => {
                     if (node.nodeType !== Node.ELEMENT_NODE) return;
                     for (const attr of node.attributes) {
                         if (attr.name.startsWith('@')) {
                             const eventName = attr.name.slice(1);
                             let handlerName = attr.value?.trim();

                             // If no value or empty string, use event name
                             if (!handlerName) {
                                 handlerName = eventName;
                             }

                             // Strip quotes if present
                             if ((handlerName.startsWith('"') && handlerName.endsWith('"')) ||
                                 (handlerName.startsWith("'") && handlerName.endsWith("'"))) {
                                 handlerName = handlerName.slice(1, -1);
                             }

                             const handler = egg.object[handlerName];
                             if (!handler) {
                                 console.error(`missing handler '${handlerName}' for event '${eventName}'`);
                             } else {
                                 node.addEventListener(eventName, handler.bind(egg.object));
                             }
                         }
                     }
                     for (const child of node.children) walk(child);
                 };
                 for (const node of egg.children) walk(node);
             }

             static instance(template){
                 const egg = new Egg();
                 egg.#parseTemplate(template);
                 egg.#bindNames(egg);
                 egg.object = this.#scopedEval(egg.script, "need name!", egg);
                 egg.#bindEvents(egg);
                 return egg;
             }
             static factory(template){
                 const egg  = new Egg();
                 egg.#parseTemplate(template);
                 egg.object = this.#scopedEval(egg.script, "need name 2!", egg);
                 return egg;
             }
         }



         function trimLines(text) {
             return text
                 .replace(/^\s*[\r\n]+/, '')  // Remove leading blank lines
                 .replace(/[\r\n]+\s*$/, ''); // Remove trailing blank lines
         }



         function parseTag(str, startPos){
             const result = {
                 name:       "",
                 isStart:    true,
                 emptyTag:   false,
                 attributes: [],
                 nextPos:    startPos,
                 errorPos:   -1
             };
             const tagPattern = /&lt;(\/)?\s*([A-Za-z_:][A-Za-z0-9:._-]*)\s*/y;
             tagPattern.lastIndex = startPos;
             let  match = tagPattern.exec(str);
             PARSE:{
                 if(!match) break PARSE;
                 if(match[1]) result.isStart = false;
                 result.name = match[2];
                 result.nextPos = tagPattern.lastIndex;
                 const attrPattern = /\s*([A-Za-z_:][A-Za-z0-9:._-]*)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^>\s]+)))?\s*/y;
                 attrPattern.lastIndex = tagPattern.lastIndex;
                 while ((match = attrPattern.exec(str)) !== null) {
                     const attrName = match[1];
                     const attrValue = match[2] || match[3] || match[4] || null;
                     result.attributes.push({name:attrName, value:attrValue});
                     result.nextPos = attrPattern.lastIndex;
                 }
                 const trailing = /^\s*(\/)?\s*&gt;/.exec(str.slice(result.nextPos));
                 if (!trailing){
                     console.warn("couldn't match end of tag");
                     break PARSE;
                 }
                 result.emptyTag = trailing[1] === "/";
                 result.nextPos += trailing[0].length;
                 return result;
             }
             return null;
         }
         function classifyTag(tagDescriptor){
             tagDescriptor.type = null;
             if(tagDescriptor.name == 'lp5-'){
                 if(tagDescriptor.emptyTag)
                     if(tagDescriptor.attributes.length == 1)
                         if(tagDescriptor.attributes[0].name == 'ref'){
                             tagDescriptor.type = 'ref';
                             tagDescriptor.value = tagDescriptor.attributes[0].value;
                         }
             } else if(tagDescriptor.name == 'lp5-endscript'){
                 if(tagDescriptor.attributes.length == 0)
                     if(tagDescriptor.emptyTag)
                         tagDescriptor.type = 'endscript';
             }
             return tagDescriptor.type;
         }
         /* parseCode() - break code into text and directives.
          *
          * returns an array, where each element is either a string
          * of literal text or an lp5 tag descriptor.
          */
         function parseCode(escapedScript){
             const result = [];
             if(!escapedScript)
                 return result;
             const tagPattern = /&lt;(\/)?\s*lp5-/g;  // lp5 start or end tag
             let   posStart     = 0;
             let   posNext      = 0;
             let   length       = escapedScript.length;
             let   match;
             while(posNext < length){
                 posStart             = posNext;
                 tagPattern.lastIndex = posStart;
                 match                = tagPattern.exec(escapedScript);
                 if(match == null)
                     posNext     = length;
                 else
                     posNext = match.index;
                 if(posStart < posNext)
                     result.push(escapedScript.substring(posStart, posNext));
                 if(match){ // if there is another lp5- tag
                     const tagDescriptor = parseTag(escapedScript, match.index);
                     if(tagDescriptor){
                         let typename = classifyTag(tagDescriptor);
                         if(tagDescriptor.type === 'ref'){
                             const lineStart = escapedScript.lastIndexOf('\n', match.index)+1;
                             const prefix = escapedScript.substring(lineStart, match.index);
                             tagDescriptor.indent = /^[ ]*$/.test(prefix) ? prefix.length : 0;
                         }
                         result.push(tagDescriptor);
                         posNext = tagDescriptor.nextPos;
                     }
                     else{
                         result.push("BAD LP5 TAG:<");
                         ++posNext;
                     }
                 }
             }
             return result;
         }
         function showFatalError(message) {
             // 1) Show a big overlay blocking the page
             const overlay = document.createElement("div");
             overlay.style.position = "fixed";
             overlay.style.top = "0";
             overlay.style.left = "0";
             overlay.style.width = "100%";
             overlay.style.height = "100%";
             overlay.style.backgroundColor = "rgba(0,0,0,0.8)";
             overlay.style.color = "white";
             overlay.style.fontSize = "1.2em";
             overlay.style.zIndex = "999999";
             overlay.style.display = "flex";
             overlay.style.flexDirection = "column";
             overlay.style.justifyContent = "center";
             overlay.style.alignItems = "center";

             overlay.innerHTML = `
                 <h1>Fatal Error</h1>
                 <p>${message}</p>
             `;
             document.body.appendChild(overlay);

             // 2) Also log to console for developers
             console.error("FATAL ERROR:", message);

             // 3) Throw an error so that no further code in this call stack runs
             throw new Error("FATAL: " + message);
         }

        <template data-custom="lp5-treeview">
            <!-- Hierarchical Treeview -->
            <style>

             /* Remove default padding and inline-start indentation on ul
              * to prevent first-level items from being indented
              */
             ul {
                 list-style-type: none;
                 padding-left: 0; /* Remove the default padding */
                 padding-inline-start: 0; /* Remove the default inline-start padding */
                 margin: 0;
             }

             /* Indentation for nested <ul> elements using em to scale */
             /*ul.treeview */ ul ul {
                 padding-left: 1.00em; /* Indent nested lists based on font size */
                 list-style-type: none; /* Remove list bullet points */
             }

             /* Indentation for <li> elements */
             li {
                 cursor: pointer;
                 display: block;
                 position: relative;
                 font-size: 1rem; /* Use rem to scale font size proportionally */
                 user-select: none; /* Disable text selection on list items */
             }

             /* For all li elements, apply the hidden triangle  */
/*             ul[data-id="lp5-treeview"] > ul >li::before { */
             li::before {
                 content: "\25B6 "; /* Right-pointing triangle */
                 margin-right: 0;
                 cursor: pointer;
                 display: inline-block;
                 width: 1em; /* Triangle width */
                 height: 1em; /* Ensure consistent height */
                 text-align: center;
                 font-size: 0.75em; /* Triangle size */
                 line-height: 1em;
                 visibility: visible;
             }

             /* Show the triangle for li elements that do not have a <ul> as a direct child */
             li:not(:has(> ul))::before {
                 visibility: hidden; /* Hide the triangle */
             }

             /* Horizontal line indicating where the dragged item will go */
             li.drop-target-before {
                 box-shadow: inset 0 2px 0 0 rgba(0, 123, 255, 0.5); /* Shadow on the top of the element */
             }

             /* Horizontal line indicating the "after" drop location */
             li.drop-target-after {
                 box-shadow: inset 0 -2px 0 0 rgba(0, 123, 255, 0.5); /* Shadow on the bottom of the element */
             }

             /* Highlight the target area while dragging */
             li.over {
                 border: 2px dashed #007bff; /* Adds a dashed border to indicate a valid drop area */
                 background-color: #f0f8ff;  /* Light background to highlight the target */
             }

             /* When an item is being dragged, reduce its opacity */
             li.dragging {
                 opacity: 0.1;  /* Makes the dragged item semi-transparent */
             }

             /* When the container item is expanded, use the down-pointing triangle */
             li.expanded::before {
                 content: "\25BC "; /* Downward-pointing triangle */
             }

             /* Ensure nested <ul> elements are collapsed by default */
             ul ul /*.nested */ {
                 display: none;
             }

             /* When active, display nested <ul> */
             ul ul.active {
                 display: block;
             }

             /* Style for the selected item */
             .selected {
                 background-color: lightblue;
                 font-weight: bold;
             }

             span {
                 font-size: 1rem; /* Use rem for text size */
             }
             slot { display: none; }
            </style>

            <script>
             const {deferShadowEvent} = require('controller');

             function makeAllLiDraggable(ancestor, ){
                 const items = ancestor.querySelectorAll('li');
                 items.forEach(item => {
                     item.setAttribute('draggable', 'true');
                 });
             }
             // Add an event listener on the UL element (capture phase)
             //             treeView.addEventListener('click', function(event) {

             class TreeView extends LP5Element {
                 #treeview    = null;
                 #dirty       = true;
                 #slot        = null;
                 #selectEvent = "lp5-treeview:select";
                 #template;
                 constructor(){
                     super();
                     this.#template = new LP5Element.TemplateInstance();
                     this.#slot     = this.#template.namedNodes.slot;
                 }

                 #toggleList(li) {
                     const nestedList = li.querySelector('ul');
                     if (nestedList) {
                         nestedList.classList.toggle('active');
                         li.classList.toggle('expanded');
                     }
                 }
                 #contextMenuHandler(event){
                     console.error("TreeView contextMenuHandler!!!!!", event);
                 }
                 #clickHandler(event){
                     event.preventDefault();
                     const target = event.target;
                     const li     = target.closest('li');
                     
                     if (li) { // if click was inside <li>
                         const span     = li.querySelector(':scope > span');
                         const nestedUl = li.querySelector('ul');
                         
                         if(target.closest('span') === span)// click in span is always selection
                             this.#selectItem(li);
                         else if(nestedUl) // not in span, but there is triangle
                             this.#toggleList(li);
                         else // not in span, but no triangle, so select anyway.
                             this.#selectItem(li);
                     }
                 }

                 #selectItem(li) {
                     selected?.classList.remove('selected');
                     li.classList.add('selected');
                     selected = li;
                     deferShadowEvent(this, this.#selectEvent, li);
                 }
                 #handleSlotChange() {
                     this.render();
                     this.#dirty = false;
                 }
                 #wrapSlotContent() {
                     const container = this.#template.namedNodes["lp5-treeview"];
                     this.#slot.assignedNodes().forEach(node => {
                         container.append(node.cloneNode(true));
                     });

                     return;
                 }

                 connectedCallback(){

                     super.connectedCallback();
                     this.#treeview = this.#template.namedNodes["lp5-treeview"];
                     console.assert(this.#treeview, "Missing <ul data-id='lp5-treeview'>");
                     this.#treeview.addEventListener('click', event=>this.#clickHandler(event), true);
                     this.#treeview.addEventListener('contextmenu', event=>this.#contextMenuHandler(event), true);
                     //??? must put directly on slot node!
                     this.#treeview.addEventListener('slotchange', event=>this.#handleSlotChange(event), true);
                     this.render();
                 }
                 setContent(nodes){
                 }
                 render(){
                     if(this.#dirty){
                         this.#wrapSlotContent();
                         makeAllLiDraggable(this.#treeview);
                     }
                     this.#dirty = false;
                 }
             }
             if(false) if(treeView.dataset.drag){
                 const items = treeView.querySelectorAll('li');
                 items.forEach(item => {
                     item.setAttribute('draggable', 'true');
                 });

             }

             function move(liFrom, liTo, relPos){
                 console.log("move", liFrom, liTo, relPos);
             }

             // drag-and-drop code
             let previousTarget     = null;  // Store the last hovered element
             let currentTarget      = null;

             function dragAndDrop(){

                 let currentDropTarget  = null;
                 let undo               = () => null;
                 let relPos             = null;
                 const api              = {}

                 //                 treeView.addEventListener('dragstart', function(event) {
                 api.dragstart = function dragstart(event) {
                     const li = event.target.closest('li');
                     console.log("dragstart", li);
                     if(li){
                         li.classList.add('dragging');
                         currentDragSource = li;
                         event.dataTransfer.dropEffect    = "move";
                         event.dataTransfer.effectAllowed = "move";
                     }
                 }

                 //                 treeView.addEventListener('dragenter', function(event) {
                 api.dragenter = function dragenter(event){
                     event.preventDefault();  // Allow the drop
                 }
                 api.dragover = function dragover(event){
                     event.preventDefault();  // Allow the drop
                     const li = event.target.closest('li');

                     if (li){
                         undo();
                         if(!li.classList.contains('dragging')){
                             const rect    = li.getBoundingClientRect();
                             const upper   = event.clientY < rect.top + rect.height / 2;
                             relPos = upper ? 'before' : 'after';
                             const dropClass = 'drop-target-' + relPos;
                             li.classList.add(dropClass);
                             undo =  () => li.classList.remove(dropClass);
                         } else
                             undo = () => null;
                         currentDropTarget = li;
                     }
                 }

                 // Event listener for dragend (cleanup after the drag is done)
                 api.dragend = function dragend(event){
                     const draggedItem = event.target;
                     if (draggedItem.tagName === 'LI')
                         draggedItem.classList.remove('dragging');
                     undo();
                 }


                 // Event listener for drop events on the parent UL element
                 api.drop = function drop(event){
                     event.preventDefault();
                     const target = event.target.closest('li');
                     console.log("drop", target);

                     target.classList.remove('over');
                     currentTarget = null;

                     api.move(currentDragSource, currentDropTarget, relPos);
                 }
                 return  api;
             }

                                     if(Array.isArray(stuff))

                     }

                         for await (const [name, handle] of parentHandle.entries()){
                             if(name.endsWith('.lp5') && handle.kind == 'directory'){

                     // if it was simply require('singleItem')
                     if(things.length == 1){
                         if(thing in globalEnv)
                             return globalEnv[thing];
                         else
                             assert(false,
                                    `'${thing}': undefined name for require`);
                     }
                     // else we are returning a set of sets, more or less
                     let finalObj = {};
                     things.forEach(function requireFinalLoop(i){
                         console.assert(i in globalEnv, i);
                         finalObj[i] = globalEnv[i];
                     });
                     return finalObj;
                 }

                 let sourceMap = "\n//# sourceURL=" + scriptName + "\n";
                 console.log("before scopedEval2 return");
                 controller.script = script;
                 controller.scriptName = scriptName;
                 const result = new Function(
                     "require", "LP5Element", '"use strict";' + script + sourceMap).call(
                         scriptThis, require, globalEnv["LP5Element"]);
                 controller.script = null;
                 
                 return result;
             }

                 const result = new Function(
                     '"use strict";' + script + sourceMap).call(globalEnv);
                 controller.script = null;

                     get(trapTarget, key, receiver){
                         console.assert(key in receiver, key);

                     }
                 });

                     iView             : iView,
                     dataID            : iView.dataID,
                     Article           : Article,
                     [Symbol.iterator] : function*(){
                         const args = Object.keys(globalEnv);
                         for(let i=0; i < args.length; ++i) 
                             yield globalEnv[args[i]];
                     }

                 function require(thing){
                     // split into non-empty args
                     let things = thing.split(/[ ,]+/).filter(i=>i.length);
                     // if it was simply require('singleItem')
                     if(things.length == 1){
                         if(thing in globalEnv)
                             return globalEnv[thing];

                     // else we are turning a set of sets, more or less
                     let finalObj = {};

        <script>
         window.LP5.modStateMachine = (function(){

             function insertCode(startState, preamble, states){
                 const result =
`
//(() => {
//# sourceURL=stateMachine
let state = '${startState}';
function* machine() {
    ${preamble.join('\n')}
    let event = null;
    while (true) {
        console.warn("state, event=",state,event);
        event = yield state;
        switch (state) {
${states}
        default: console.error("unknown state:", state);
        }
    }
}
const gen = machine();
function send(event){
    console.error("send ", event);
    gen.next(event); return state;
}
send();
return {
    send
  };
//})()
`;
                 return result;
             }

             const definedStates    = new Set();
             const referencedStates = new Set();
             let   sourceIndent     = Infinity;
             const preamble         = [];
             let   states           = "";
             let   startState       = null;
             function columnOfTarget(line) {
                 const arrow = line.indexOf('->');
                 if (arrow === -1) return -1;      // no arrow
                 let i = arrow + 2;     // just after the ‘->’
                 while (i < line.length && line[i] === ' ') i++;
                 return i; // this is the column where “*” or your identifier starts
             }

             function indent(indent, more){
                 return ' '.repeat(indent) + more;
             }
             function stripIndent(s){
                 let result = s;
                 if(s.startsWith(' '.repeat(sourceIndent)))
                     result = s.slice(sourceIndent);
                 return result;
             }
             const pass1 = {
                 doState(line, stateName) {definedStates.add(stateName); },
                 doGoto(line, targetState) {referencedStates.add(targetState);},
                 doOther(line) {
                     const indent = window.LP5.modString.getIndent(line);
                     if (indent >= 0)
                         sourceIndent = Math.min(sourceIndent, indent);
                 }
             };
             const pass2 = {
                 firstState: null,
                 firstEvent: true,
                 closeEvent(){
                     if(!this.firstEvent)
                         states += indent(16, `}\n`);
                 },
                 closeState(){
                     states += indent(12, `}\n`);
                     states += indent(12, `break;\n`);
                 },
                 doPreamble(line) {
                     line = stripIndent(line);
                     preamble.push(indent(4,line));
                 },
                 doState(line, stateName) {
                     if(this.firstEvent !== true)
                         this.closeEvent();
                     this.firstEvent = true;
                     if(this.firstState !== null)
                         this.closeState();
                     else
                         this.firstState = stateName;
                     states += indent(8, `case '${stateName}': {\n`);
                 },
                 doOnEvent(line, eventName) {
                     let elseMaybe  = this.firstEvent ? "" :"else ";
                     let matchEvent = 'true';
                     if(eventName !== '*')
                         matchEvent = `event.type === '${eventName}'`;
                     this.closeEvent();
                     states += indent(12,`${elseMaybe}if(${matchEvent}) {\n`);
                     this.firstEvent = false;
                 },
                 doGoto(line, targetState) {
                     let column = columnOfTarget(line) - sourceIndent;
                     if(column < 0) column = 0;
                     let text = ""
                     if(targetState === "*")
                         text = `event = yield state\n`;
                     else
                         text = `{state = '${targetState}'; break; }\n`;
                     states += indent(column + 12, text);
                 },
                 doOther(line) {
                     let thisIndent = 4;
                     if(!this.firstEvent)
                         thisIndent += 4;
                     states += indent(thisIndent,line) + "\n";
                 },
                 doEof(){
                     this.closeEvent();
                     this.closeState();
                 }
             };

             function parse(lines, actions) {
                 const stateRegex = /^\s*state\s+(\w+)/;
                 const onRegex    = /^\s*on\s+(\*|\w+)/;
                 const gotoRegex  = /^\s*->\s*(\*|\w+)/;

                 startState = null
                 for (let i = 0; i < lines.length; i++) {
                     const line = lines[i];
                     let match;

                     if (match = stateRegex.exec(line)) {
                         if(startState === null)
                             startState = match[1];
                         actions.doState?.(line, match[1]);
                     } else if (match = onRegex.exec(line)) {
                         actions.doOnEvent?.(line, match[1]);
                     } else if (match = gotoRegex.exec(line)) {
                         actions.doGoto?.(line, match[1], i);
                     } else if(startState === null) {
                         actions.doPreamble?.(line, i);
                     } else {
                         actions.doOther?.(line, i);
                     }
                 }
                 actions.doEof?.();
             }

             function compileStateMachine(src) {
                 const lines            = src.split(/\r?\n/);
                 parse(lines, pass1);
                 console.error("sourceIndent = ", sourceIndent);
                 parse(lines, pass2);
                 return insertCode(startState, preamble, states);
             }
             function compile(){
                 const machineSource = document.getElementById('lp5StateMachine').textContent;
                 console.error("machine source", machineSource);
                 const compiled = compileStateMachine(machineSource);
                 console.error("compiled machine", compiled);
                 // const machine = eval(compiled);
                 LP5.controller.script     = compiled;
                 LP5.controller.scriptName = "stateMachineCode";
                 const machine             = new Function(compiled);
                 LP5.controller.script     = null;
                 console.error("MACHINE = ", machine);
                 return machine();
             }
             return compile();
         })();
        </script>
