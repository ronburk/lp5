        <template data-name="ArticleContextMenu">
            <div>
                <dialog id="ArticleContextMenu" class="lp5-context">
                    <ul data-id="ul">
                        <li data-cmd="createArticle -1">Insert New Article Before</li>
                        <li data-cmd="createArticle  1">Append New Article After</li>
                        <li data-id="childOption" data-cmd="createArticle  0">Create First Child Article</li>
                    </ul>
                </dialog>
            </div>
            <script>
             const {ul, childOption} = require('dataID');
             let articleTarget = null;

             function clickHandler(event){
                 console.log("clickHandler ", event);
                 const target = event.target;
                 console.log("cmd ", target.dataset.cmd);
                 if(target.dataset.cmd){
                     let argv = target.dataset.cmd.split(/[ ]+/);
                     argv.push(articleTarget);
                     console.log("argv = ", argv);
                     document.dispatchEvent(
                         new CustomEvent('command', {
                             detail : argv,
                     }));
                 }
             }
             function init(iView, article){
                 articleTarget = article;
                 ul.addEventListener('click', clickHandler);
             }
             function render(iView, article){
                 if(article.ulNode){
                     childOption.style.display = 'none';
                 } else {
                     childOption.style.display = 'block';
                 }
             }
             return {init:init, render:render};
            </script>

        <template data-name="EditSection">
            <style>
             .table { display: table; }
             p      { display: table-row; }
             label  { display: table-cell; vertical-align: text-top;}
             input  { display: table-cell; }
             button { display: table-cell; }
             textarea { display: table-cell; vertical-align: text-top; width: 100%;}
             .col1 { display: table-column; }
             .col2 { display: table-column; }
            </style>
            <dialog id="EditSection">
                <div class="table">
                    <div class="col1"></div>
                    <div class="col2"></div>
                    <p>
                        <button data-id="save">Save</button>
                        <button data-id="cancel">Cancel</button>
                    </p>
                    <p>
                        <label>title:</label>
                        <input data-id="articleTitle" type="text"/>
                    </p>
                    <p>
                        <label>documentation:</label>
                        <textarea data-id="docText" rows="10" cols="60"></textarea>
                    </p>
                    <p>
                        <label>name:</label>
                        <input data-id="codeName" type="text"/>
                    </p>
                    <p>
                        <label>code:</label>
                        <textarea data-id="codeText" rows="10" cols="60"></textarea>
                    </p>
                </div>
            </dialog>
            <script>
             const {model, dataID, Article} = require('model,dataID,Article');
             const {save, cancel, articleTitle, docText, codeName, codeText} = dataID;

             let   thisArticle = null;

             function sectionGetTitle(article){
                 console.log("sectionGetTitle ", article);
                 return article.titleNode.innerText;
             }
             function clickSave(event){
                 console.log("clickSave!!!");
                 // serialize contents of editing dialog
                 let serial = Article.createSerial(
                     thisArticle.ulNode,
                     articleTitle.value, docText.value,
                     codeName.value, codeText.value);

                 document.dispatchEvent(
                     new CustomEvent('saveArticle', {
                         detail : serial,
                 }));
             }
             function init(iView, node){
                 console.log("EditSection ", node);
                 save.addEventListener('click', clickSave);
             }
             function renderEditSectionDialog(iView, article){
                 console.log("EditSection Dialog render!!!!!!", article);
                 thisArticle = article; // remember for future use
                 let title = sectionGetTitle(article);
                 console.log("Title is ", title);
                 articleTitle.value = title;
                 let value = "";
                 if(article.docSectionNode){
                     value = article.docSectionNode.innerHTML;
                     value = value.replace(/^\s*<h2[^<]+[^>]+>/,'');
                     docText.value = Article.unindentCode(value);
                 }
                 if(article.codeSectionNode){
                     value = article.scriptNode.childNodes[0].textContent;
                     codeText.value = Article.unindentCode(value);
                 }
             }
             function respond(iView, event){
                 console.log("EditSection responds to event ", event);
                 if(event.target == cancel){
                     console.log("Got cancel!");
                 } else if(event.target == save){
                     console.log("Got save!");
                     let article = thisArticle;
                     article.titleNode.innerText = articleTitle.value;
                 }
             }
             let result = {
                 init   : init,
                 render : renderEditSectionDialog,
                 respond: respond
             };
             return result;
            </script>
        </template>

                <template data-name="tableOfContents">
                    <nav id="LP5-Toc">
                    </nav>
                    <script>
                     const iView = require('iView');
                     const model = require('model');
                     const createFreeElement = require('createFreeElement');
                     function init(){
                     };
                     function getTitle(li){
                         let ID = li.getAttribute('id');
                     }
                     function renderChildTOC(article){
                         console.assert(article.ulNode);
                         let ul    = createFreeElement('ul');

                         article.ulNode.querySelectorAll('li').forEach((entry)=>{
                             let li           = createFreeElement('li');
                             let id           = entry.getAttribute('id');
                             let childArticle = model.articles.fromURL(id);
                             console.assert(childArticle, {id:id});
                             if(childArticle.titleNode)
                                 li.innerText = childArticle.titleNode.innerText;
                             else
                                 li.innerText = "< no title >";
                             ul.appendChild(li);
                             if(childArticle.ulNode)
                                 ul.appendChild(renderChildTOC(childArticle));
                         });
                         return ul;
                     }
                     function renderTOC(){
                         console.log("render toc: ", model.rootTOC);
                         let article = model.rootTOC;
                         if(article && article.ulNode){
                             let ul = renderChildTOC(article);
                             iView.rootNode.shadowRoot.replaceChildren(ul);
                         }
                         return;
                     };
                     let result = {init:init, render:renderTOC};
                     return result;
                    </script>

                <template data-name="sourceDiv">
                    <div id="LP5-Source" data-id="outerDiv">

                    <script>
                     const {drag, outerDiv} = require('dataID');
                     const {model, Article} = require('model, Article');
                     function init(){
                     };
                     function massageCode(text){
                         console.log("massageCode ", text);
                         let result = text = text.replaceAll(/[&]lt;/g,'<');
                         let lines = text.split(/\r?\n/);
                         let indent = -1;
                         for(let line of lines){
                             line = line.replace(/\s+$/,'');
                             if(line.length){
                                 let thisIndent = line.search(/\S|$/);
                                 if(indent == -1 || thisIndent < indent){
                                     indent = thisIndent;
                                 }
                             }
                         }
                         if(indent > 0){
                             let space = " ".repeat(indent);
                             let regex = new RegExp("^" + space, 'gm');
                             result = text.replace(regex, '');
                             console.assert(result != text);
                         }
                         return result;
                     }
                     function renderSection(res){
                         console.log("renderSection ", res);
                         let {docSectionNode, ulNode} = res;
                         if(docSectionNode){
                             console.log("Appending article node");
                             outerDiv.appendChild(res.articleNode);
                             
                             if(res.scriptNode){
                                 console.log("   got script node ");
                                 res.codeTextNode.innerText = Article.unindentCode(
                                     res.scriptNode.innerText);
                             }
                         }
                         if(ulNode){
                             console.log("nested ul node", ulNode);
                             ulNode.style.display = 'none';
                             ulNode.querySelectorAll('li').forEach((li)=>{
                                 let id = li.getAttribute('id');
                                 console.assert(id, ulNode);
                                 //                                 let res = model.resources.get(id);
                                 let res = model.articles.fromURL(id);
                                 console.assert(res, id);
                                 renderSection(res);
                             });
                         }
                     }
                     function renderSource(){
                         console.log("render source: ", model.rootTOC);
                         if(model.rootTOC){
                             outerDiv.replaceChildren();
                             outerDiv.appendChild(drag);
                             renderSection(model.rootTOC);
                         }
                     };
                     let result = {init:init, render:renderSource};
                     return result;
                    </script>

        <script>
         "use strict";
         void function(){
             // defense against malformed HTML leading to insane behavior
             function findBadTemplate(e){
                 if(e.childNodes)
                     e.childNodes.forEach((c)=>{
                         if(c.nodeName != 'SCRIPT'){
                             findBadTemplate(c);
                             if(/\<\//.test(c.innerText)){
                                 console.log("Element contains a close tag?");
                                 console.assert(!c, c);
                             }
                             if(c.content){
                                 findBadTemplate(c.content);
                             }
                         }
                     });
             }
             
             findBadTemplate(document);

             class Storage {
                 constructor(dirHandle){
                     this.dirHandle = dirHandle;
                 }
                 async exists(name){
                     let result = false;
                     try {
                         let handle = await this.dirHandle.getFileHandle(
                             name, {create:false});
                         result = true;
                     } catch(err) {
                         console.log(`exists(${name}) fails: `, err);
                     }
                     return result;
                 }
                 async write(name, data){
                     let result     = false;
                     let fileHandle = null;
                     let writable   = null;
                     try {
                         fileHandle = await this.dirHandle.getFileHandle(name);
                         console.log("Got fileHandle ", fileHandle);
                     } catch(err) {
                         console.log(`Storage.write(${name}) `, err);
                     }
                     try {
                         writable = await fileHandle.createWritable();
                     } catch(err) {
                         console.log("createWritable ", err);
                     }
                     try {
                         await writable.write(data);
                     } catch(err) {
                         console.log("writable.write ", err);
                     }
                     try {
                         await writable.close();
                         result = true;
                     } catch(err) {
                         console.log("writable.close ", err);
                     }
                     return true;
                 }
                 async read(name){
                     let text = null;
                     try {
                         const fileHandle = await this.dirHandle.getFileHandle(name);
                         console.assert(fileHandle);
                         const file = await fileHandle.getFile();
                         text = await file.text();
                     } catch (e) {
                         console.log(`read(${name}) failed`, e);
                     }
                     return text;
                 }
                 async createUniqueFile(pattern, number){
                     let   result    = null;
                     const MAX_TRIES = 99;
                     let   handle    = null;
                     let   name      = "";
                     console.assert(this.dirHandle);
                     for(let i = 0; i < MAX_TRIES; ++i){
                         ++number;
                         name   = pattern.replace(/%d/, number);
                         try {
                             console.log(`getFileHandle(${name})`);
                             await this.dirHandle.getFileHandle(
                                 name, {create:false});
                         } catch(err) {
                             if(err.name == 'NotFoundError')
                                 break;
                             else{
                                 console.log(`getFileHandle(${name}) failed:`, err);
                                 return null;
                             }
                             break;
                         }
                     }
                     try {
                         handle = await this.dirHandle.getFileHandle(
                             name, {create:true});
                         result = handle;
                     } catch(err) {
                         console.log(`createUniqueFile(${pattern},${startNumber}) failed`);
                         console.assert(false, err);
                     }
                     return result;
                 }
             }
             let Articles = null;
             let Article  = null;
             void function() {
                 let secret = Symbol("new Article()");
                 Articles = class {
                     #array;
                     constructor(){
                         this.#array = new Array();
                         //                         this[Symbol.iterator] = this.#array[Symbol.iterator];
                     }
                     *[Symbol.iterator](){ yield* this.#array }
                     newArticle(parent=null, URL=""){
                         let newArticle = new Article(secret, parent, URL);
                         if(newArticle){
                             newArticle.articleNode.id = `article-${this.length}`;
                             this.#array.push(newArticle);
                         }
                         return newArticle;
                     }
                     get length(){
                         return this.#array.length;
                     }
                     fromArticleNode(node){
                         // the article node ID contains the article #
                         let id = node.id;

                     static unindentCode(text){

                         text = text.replace(/\s*$/,'') + '\n';
                         let result = text;
                         let lines = text.split(/\r?\n/);
                         let indent = -1;
                         for(let line of lines){
                             line = line.replace(/\s+$/,'');

             async function putDB(db, key, value){
                 console.log("putDB: ", key, value);
                 return new Promise((resolve, reject) => {
                     let txn = db.transaction(["handles"], "readwrite");
                     txn.objectStore("handles")
                        .add(value, key)
                     ;

                     txn.oncomplete = (event) => { resolve(txn.result); };
                 });
             }

             async function getDB(db, key){
                 return new Promise((resolve, reject) => {
                     console.log("getDB: ", key);

                     let get = txn.objectStore("handles")
                                  .get(key)
                     ;

                     txn.onerror    = (event) => { console.log("getDB error!");reject(); }
                     console.log("getDB() end of function");
                 });

             function scopedEval(script, iView){
                 console.log("scopedEval ", iView, script);
                 for(const element of iView.rootNode.shadowRoot.querySelectorAll("[data-ID]")){
                     console.log("Found data-id of ", element.dataset.id);
                     iView.dataID[element.dataset.id] = element;
                 }

                 if(dataID)
                     iView.dataID[dataID] = iView.rootNode;

                 iView.dataID = new Proxy(iView.dataID, {
                     get(trapTarget, key, receiver){
                         console.assert(key in receiver, key);
                         return Reflect.get(trapTarget, key, receiver);
                     }
                 });
                 let globalEnv = {
                     require           : require,
                     createFreeElement : createFreeElement,
                     model             : controller.model,
                     views             : controller.views,
                     iView             : iView,
                     dataID            : iView.dataID,
                     Article           : Article,
                     [Symbol.iterator] : function*(){
                         const args = Object.keys(globalEnv);
                         for(let i=0; i < args.length; ++i) 
                             yield globalEnv[args[i]];
                     }
                 };
                 function require(thing){
                     let things = thing.split(/[ ,]+/);
                     console.log("things = ", things);
                     let final  = [];
                     things.forEach(function requireFirstLoop(i){
                         if(i.length)
                             final.push(i);
                     });
                     console.log("final is ", final);
                     // if it was simply require('singleItem')
                     if(final.length == 1){
                         if(thing in globalEnv)
                             return globalEnv[thing];
                         else
                             console.assert(false);
                     }
                     let finalObj = {};
                     final.forEach(function requireFinalLoop(i){
                         console.assert(i in globalEnv, i);
                         finalObj[i] = globalEnv[i];
                     });
                     return finalObj;

                     switch(thing){
                         case 'controller':
                             return controller;
                         case 'model':
                             return controller.model;
                         case 'views' :
                             return controller.views;
                         case 'iView':
                             return iView;
                         default:
                             console.assert(false);
                     }
                 }
                 return new Function(
                     "require", '"use strict";' + script)(
                         require);
                 return new Function(...(Object.keys(globalEnv)),
                                     '"use strict";' + script)(
                                         ...globalEnv);
             }

                 name         : "",
                 dialogNode   : null,
                 notify       : null,
                 children     : [],
                 rootNode     : null,
                 dataID       : {},
             };
             controller.views = {
                 views       : {},
                 listeners   : {},
                 stack       : [],
                 inProgress  : 0,
                 currentView : null,
                 notifyModelChange(info){
                     Object.keys(listeners).forEach(
                         function(k){
                             const func = listeners[k].notify;
                             if(func)
                                 func(info);
                         }
                     );
                 },
                 loadTemplates(rootElement=document, parentView=null){
                     console.log("views.loadTemplates()", rootElement);
                     console.log(rootElement.querySelectorAll('template').length);

                     rootElement.querySelectorAll('template').forEach((t)=>{
                         let scriptNode = null;
                         t.content.querySelectorAll('script').forEach((s)=>{
                             console.log("found script ", s);
                             if(s.parentNode.nodeName != '#document-fragment'){
                                 die("script not direct child of template node", t, s);
                             } else if(s.parentNode == t.content){
                                 if(scriptNode){
                                     die("Only one script per template!", s);
                                 } else {
                                     scriptNode = s;
                                     console.log("    and removed script");
                                     scriptNode.remove();
                                 }
                             }
                         });

                         const rootNode = createFreeElement('div');
                         const shadow   = rootNode.attachShadow({mode:'open'});
                         console.log("t.content is [${t.content.children.length}]",
                                     t.content);
                         let child=null;
                         while(child = t.content.firstChild){
                             console.log("appending child ", child);
                             console.assert(child.nodeName != 'SCRIPT');
                             shadow.appendChild(child);
                         }
                         if(false)
                         for(let i= 0; i < t.content.children.length; ++i){
                             let child = t.content.children[i];
                             console.log("appending child ", child);
                             console.assert(child.nodeName != 'SCRIPT');
                             shadow.appendChild(child);
                         }
                         console.log("rootNode is ", rootNode);

                         const iView    = structuredClone(viewInterface);
                         iView.name     = t.dataset.name; // data-name='xxx'
                         console.log(`template named ${iView.name}, parent `, parentView);
                         
                         // if this is a child template
                         if(parentView){
                             iView.rootNode = rootNode;
//                             t.replaceWith(t.content);
                             t.replaceWith(rootNode);
                         } else {
                             // clone template, then discard it
                             //                             iView.rootNode = templateRoot.cloneNode(true);
                             iView.rootNode = rootNode;
                             t.remove();
                             const dialogNode = iView.rootNode.shadowRoot.querySelector('dialog');
                             if(dialogNode){
                                 iView.dialogNode = dialogNode;
                                 // do not define dialog 'open' attribute, please
                                 console.assert(!dialogNode.hasAttribute('open'));
                             }
                         }

                         // Removing the open attribute will usually hide the dialog.
                         // However, doing so has strange additional consequences:
                         // https://html.spec.whatwg.org/multipage/interactive-elements.html#the-dialog-element
                         //                     let script = templateRoot.querySelector('script');
                         if(scriptNode){
                             // remove script else it will run when frag inserted into DOM
                             try {
                                 // run the script to obtain its notification functions
                                 console.log(" eval the script");
                                 iView.notify   = scopedEval(scriptNode.innerHTML, iView);
                             } catch(error){
                                 console.log("Failed on script: ", scriptNode.innerHTML);
                                 console.assert(false, error);
                             }
                             console.assert(iView.notify.hasOwnProperty('init'));
                             console.assert(iView.notify.hasOwnProperty('render'));
                         } else {
                             iView.notify = null;
                         }
                         // two templates with same name is a mistake
                         console.assert(!this.views.hasOwnProperty(iView.name));

                         if(!parentView){ // if this is an outermost template
                             // recurse to handle any nested children
                             this.loadTemplates(iView.rootNode.shadowRoot, iView);
                             this.views[iView.name] = iView;
                         } else {
                             parentView.children.push(iView);
                         }

                     });

                     if(!parentView){
                         // known starting view must be defined
                         console.assert(this.views.hasOwnProperty('home'));
                     }
                 },
                 notifyChange(eventName){
                     //                     eventTarget.dispatchEvent(
                 },
                 exists(viewName) {
                     return this.views.hasOwnProperty(viewName);
                 },
                 change(viewName) {
                     console.log(`views.change(${viewName})`);
                 ++this.inProgress;
                     // get interface to incoming view
                     const newView = this.views[viewName];
                     //                 this.currentView = this.views[viewName];
                     //                 console.assert(this.currentView);
                     console.assert(newView);
                     this.setBody(newView);
                     --this.inProgress;
                     //                 this.currentView.notify.init();
                     this.init(this.currentView);
                 },
                 init(iView, ...args){
                     console.log("init iView ", iView);
                     if(iView.notify){
                         console.log("    childcount= ", iView.children.length);
                         iView.notify.init(iView, ...args);
                     } else {
                         console.log("   (no notify function!)");
                     }
                     iView.children.forEach((i)=>this.init(i, ...args));
                 },
                 respond(...args){
                     let iView = this.currentView;

                     if(iView.notify && iView.notify.respond)
                         iView.notify.respond(iView, ...args);
                     else
                         console.log("respond not forwarded for ", iView);
                 },
                 render(iView, ...args){
                     if(!iView)
                         iView = this.currentView;
                     console.log("render ", iView);
                     if(iView.notify)
                         iView.notify.render(iView, ...args);
                     if(iView.children)
                         iView.children.forEach((i)=>i.notify.render(i, ...args));
                 },
                 push(dialogName, ...args) {
                     console.log("views.push ", dialogName);
                     ++this.inProgress;
                     console.assert(this.currentView);
                     this.stack.push(this.currentView);
                     const iView = this.views[dialogName];
                     this.setBody(iView);
                     this.currentView = iView;
                     console.log("views.push calls init for ", iView);
                     this.init(this.currentView, ...args);
                     this.render(this.currentView, ...args);
                     --this.inProgress;
                 },
                 pop() {
                 ++this.inProgress;
                     const currentView = this.currentView;
                     console.assert(currentView.dialogNode);
                     console.assert(currentView);
                     console.log("pop() this.current = ", currentView);
                     // our root is a div containing a dialog
                     const liveRootNode   = document.body.firstElementChild;
                     const liveDialogNode = liveRootNode.querySelector("dialog");
                     console.assert(liveDialogNode.nodeName == "DIALOG");
                     liveDialogNode.close();
                     console.log("pop() closes dialog");
                     liveRootNode.remove();
                     this.currentView = this.stack.pop();
                     history.pushState(null, "", `#${this.currentView.name}`);
                     --this.inProgress;
                 },
                 onHashChange(event){
                     console.log("onHashChange(): ", event);
                     // newHash = everything after '#'
                     let newHash = event.newURL.replace(/^[^#]*#/, '');
                     // newPage = everthing after '#' and before any '/'
                     let newPage = newHash.replace(/^([^/]+).*/, '$1');
                     console.log("newHash = ", newHash, "newPage = ", newPage);
                     //                 location.replace("#"+newHash);
                     //                 LP5.setBody(newHash);
                     if(!LP5.views.exists(newPage)){
                         alert(`unknown URL: ${newPage}`);
                         history.back();
                     }
                     else if(LP5.views.inProgress <= 0)
                         LP5.views.change(newPage);
                 },
                 setBody(iView){
                     const {name}      = iView;
                     const currentView = this.currentView;
                     const body        = document.body;

                     console.log(`setBody(${name})`);
                     history.pushState(null, "", "#" + name);
                     console.log(`history.pushState("#${name}")`);
                     // give current view back its nodes
                     // this only happens when change()ing one non-dialog to another
                     if(currentView && !iView.dialogNode){
                         console.log(`Giving ${currentView.name} back its nodes.`);
                         currentView.rootNode.replaceChildren(body.firstElementChild);
                     }

                     console.assert(!iView.rootNode.shadowRoot.querySelector('script'));
                     // dialogs get shoved into the start of body,
                     // leaving lower layers visible
                     if(iView.dialogNode){
                         console.log("body.prepend ", iView.rootNode);
                         body.prepend(iView.rootNode);
                         iView.dialogNode.showModal();
                     } else {
                         console.log("before problem ", iView.rootNode);
                         document.body.replaceChildren(iView.rootNode);
                         console.log("after problem");
                         /* if not showing dialog, autofocus only valid on page load,
                          * so fix that manually.
                          * https://html.spec.whatwg.org/multipage/interaction.html#the-autofocus-attribute
                          */
                         //                         let focus = document.body.querySelector("input[autofocus]");
                         //                         if(focus)
                         //                             focus.focus();
                     }
                     this.currentView = iView;
                 }
             };

             controller.compile = function(resource){
                 let output = '';
                 
                 return output;
             }

             let model = {};
             model.nextArticleID    = 0;
             model.storage          = null;
             //             model.dirHandle        = null;
             model.dirParentHandle  = null;
             model.projectName      = new Map;
             model.urlToResource    = null;
             model.articles         = new Articles();
             model.rootTOC          = null;
             model.projects         = {};
             model.anchorNameToNode = new Map();
             model.createUniqueFile = async function (){
                 let handle = await this.storage.createUniqueFile(
                     "%d.lp5", this.nextArticleID);
                 if(handle){
                     let dotPos = handle.name.indexOf('.');
                     this.nextArticleID = 1 + handle.name.slice(0,dotPos);
                 }
                 return handle;
             };

             if(false){
                 model.articleFromArticleNode = function(node){
                     // the article node ID contains the article #
                     let id = node.id;
                     console.assert(id);
                     id = node.id.replace(/^article-/,'');
                     console.assert(id >= 0);
                     console.assert(id < this.articles.length);
                     let result = this.articles[id];
                     console.assert(result, {id:id});
                     return result;
                 }
                 model.articleFromURL = function(url){
                     for(const article of this.articles)
                         if(article.URL == url)
                             return article;
                     return null;
                 }
             }
             // we want to create the backing store first, to
             // make sure we can.
             model.createEmptyArticle = async function (location, targetArticle){
                 // location: -1 = before, 0 = first child, 1 = after
                 console.log("createEmptyArticle ", location, targetArticle);
                 // create empty resource
                 let handle  = await model.createUniqueFile();
                 console.assert(handle);
                 let emptyArticleName = handle.name;
                 let parentArticle = null;
                 if(targetArticle){
                     if(location == 0)
                         parentArticle = targetArticle;
                     else {
                         console.assert(targetArticle.parent);
                         parentArticle = targetArticle.parent;
                     }
                 }
                 let newArticle = model.articles.newArticle(
                     parentArticle, emptyArticleName);
                 let serial = newArticle.toSerial();
                 let writable = await handle.createWritable();
                 await writable.write(serial);
                 await writable.close();
                 // must update some parent article correctly to point to new empty

                 // if very first article of project
                 if(!targetArticle)
                     return;

                 if(location == 0)
                     parentArticle.addFirstChild(newArticle);
                 else if(location == -1)
                     parentArticle.addChildBefore(newArticle);
                 else if(location == 1)
                     parentArticle.addChildAfter(newArticle);
                 else
                     console.assert(false);

                 let changedArticle = location ? targetArticle.parent : targetArticle;
                 serial = parentArticle.toSerial();
                 console.log("write changed article", parentArticle, serial);
                 await model.storage.write(parentArticle.URL,serial);
             };
             model.docOrder = function*(article){
                 console.assert(this.articles); // detect bogus 'this'
                 yield article;
                 let ulNode = article.ulNode;
                 if(ulNode)
                     for(const entry of ulNode.querySelectorAll(':scope > li')){
                         console.log(entry);
                         let id     = entry.getAttribute('id');
                         yield* this.docOrder(this.articleFromURL(id));
                     }
             };
             model.codeOrder = function*(queue = null){
                 if(queue === null){ // if initial iteration
                     queue = [];
                     for(const resource of this.docOrder(this.rootTOC))
                         if(resource.codeNode && !resource.codeNameNode){
                             yield resource;
                             queue.push(resource);
                         }
                 }
             }

             model.storeResource = async function(articleNode, serial){
                 console.log("storeResource ", articleNode, serial);
                 let article = this.articles.fromArticleNode(articleNode);
                 await this.storage.write(article.URL, serial);
                 return true;
             }
             model.loadResource = async function(url){
                 let text = null;
                 try {
                     const fileHandle = await this.dirHandle.getFileHandle(url);
                     console.assert(fileHandle);
                     const file = await fileHandle.getFile();
                     text = await file.text();
                 } catch (e) {
                     console.log("loadResource failed ", e);
                 }
                 return text;
             }
             model.loadArticle = async function(dirHandle, filename, parent){
                 console.log("loadResource ", filename);
                 let text = await this.loadResource(filename);
                 let result = this.articles.fromSerial(parent, filename, text);
                 //                 result.articleNode.id = `article-${this.articles.length}`;
                 
                 console.log("model.loadArticle() returns ", result);
                 return result;
             }
             model.loadTOC = async function(dirHandle, name, parent=null){
                 console.log("loadTOC ", name);
                 let article = await this.loadArticle(dirHandle, name, parent);
                 console.log("loadTOC back from await of loadArticle ", name, article);
                 let match = name.match(/^[0-9]+/);
                 if(match && match[0] > model.nextArticleID)
                     model.nextArticleID = Number(match[0]);
                 console.log(article);
                 if(article.ulNode){
                     console.log(`in loadTOC, article "${name}" has a ul`);
                     const entries = article.ulNode.querySelectorAll('li');
                     for(const li of entries){
                         let ID = li.getAttribute('id');
                         let child = await this.loadTOC(dirHandle, ID, article);
                         article.children.push(child);
                     }
                 } else
                     console.log(`in loadTOC, article "${name}" has NO ul`);
                 console.log(`loadTOC(${name}) returns `, article);
                 return article;
             }

             model.openProject = async function(name){
                 console.log("openProject ", name, this.projects);
                 const {dirHandle} = this.projects[name];
                 console.log("dirHandle ", dirHandle);
                 this.dirHandle = dirHandle;
                 this.storage   = new Storage(dirHandle);
                 this.rootTOC   = await this.loadTOC(dirHandle, name);
                 console.log("openProject got rootTOC of ", this.rootTOC);
                 console.assert(this.rootTOC.URL == name, this.rootTOC);
                 console.log("OpenProject returns after scheduling asyncComplete");
                 return true;
             }
             controller.model = model;
         }();
        </script>
    </body>
