<!-- -*- mode: web; -*- -->
<!doctype html>
<html>
    <head>
        <meta charset="utf-8" >
        <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.2.6/ace.js" integrity="sha256-xrr4HH5eSY+cFz4SH7ja/LaAi9qcEdjMpeMP49/iOLs=" crossorigin="anonymous"></script>
        <script type="text/javascript">
         window.onload = function(){
             let editor = ace.edit("editor");
             editor.on('blur', function(event){
                 console.log("blur");
             });
             editor.on('focus', function(event){
                 console.log("focus");
             });
             editor.focus();
             editor.setValue("some text");
         };
        </script>
    </head>
    <body>
        <div id="editor"  class="editor" style="height: 100px;">
            some text
        </div>
        <div id="other" style="min-height: 100px; width:300px; border: 2px solid black">
            Click here!
        </div>
    </body>
</html>
