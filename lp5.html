<!doctype html>
<!-- lp5.html <>  -->
<html lang="en">
<head>
    <meta charset="utf-8" >
    <title>lp5</title>
    <style>
        
* {
    box-sizing: border-box;
}

html,
body {
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

#LP5-TopNav {
    flex: 0 0 auto;
    padding: 0.25rem 0.5rem;
    background: #dce8f5;
    border-bottom: 1px solid #7890aa;
}

#LP5-TopNav [role="toolbar"] {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

#LP5-Main {
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
}

#LP5-Toc,
#LP5-Source,
#LP5-Output {
    min-width: 0;
    min-height: 0;
    overflow: auto;
}

#LP5-Toc {
    flex: 0 0 25%;
}

#LP5-Source,
#LP5-Output {
    flex: 1 1 0;
}

.LP5-PaneSplitter {
    position: relative;
    flex: 0 0 4px;
    cursor: col-resize;
}

.LP5-PaneSplitter::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 1px;
    width: 2px;
    background: #8293a6;
}

.LP5-PaneSplitter:hover::after {
    left: 0;
    width: 4px;
    background: #526174;
}

#LP5-Status {
    display: flex;
    align-items: center;
    flex: 0 0 1.5rem;
    min-height: 1.5rem;
    padding: 0 0.5rem;
    background: #dce8f5;
    border-top: 1px solid #7890aa;
}

    </style>
    <script>
        "use strict";
        window.LP5 = (function () {
            let controller = (() => {
    let handlerStack; // top of stack is current event handler

    function init(handler) {
        if (handlerStack !== undefined)
            throw new Error("Controller has already been initialized");
        handlerStack = [handler];
        result.dispatch = baseEventHandler;
    }

    function baseEventHandler(event) {
        for (let handler; (handler = handlerStack.at(-1)) !== undefined; ) {
            let result = handler.next(event);
            if (result.done)
                handlerStack.pop()
            else if (result.value === handler) // keep same handler
                return;
            else
                handlerStack.push(result.value);
        }
    }

    let result = {
        init: init,
        dispatch: () => { throw new Error("Controller has not been initialized"); }
    };
    return result;
})();

let operations = (() => {
    function to_handler(generator) {
        const handler = generator(() => handler);
        handler.next();
        return handler;
    }

    function* baseOperationsHandler(self) {
        while (true) {
            let event = yield self();
        }
    }

    const handler = to_handler(baseOperationsHandler);
    controller.init(handler);

    return {};
})();

            return {
                controller: controller,
operations: operations,
                };
        })();
    </script>
</head>
<body>
    <header id="LP5-TopNav">
    <div role="toolbar" aria-label="Main commands">
        <span>LP5</span>
        <button type="button">Reload</button>
        <button type="button">Export</button>
    </div>
</header>
<main id="LP5-Main">
    <nav id="LP5-Toc" aria-label="Table of contents"></nav>
    <div class="LP5-PaneSplitter" role="separator" aria-orientation="vertical"></div>
    <section id="LP5-Source" aria-label="Source"></section>
    <div class="LP5-PaneSplitter" role="separator" aria-orientation="vertical"></div>
    <section id="LP5-Output" aria-label="Output"></section>
</main>
<div id="LP5-Status" role="status">Ready</div>

</body>
</html>
