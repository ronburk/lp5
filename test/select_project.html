<!doctype html>
<meta charset="utf-8">
<title>LP5 selection and loading tests</title>
<button id="run">Test selection and loading</button>
<pre id="results">Choose the test.</pre>
<iframe id="app" title="Generated LP5 application" style="width:100%;height:420px"></iframe>
<script type="module">
const frame = document.getElementById("app");
const report = document.getElementById("results");
const button = document.getElementById("run");
const tick = () => new Promise(resolve => setTimeout(resolve, 0));
async function until(predicate) {
    for (let attempt = 0; attempt < 100; attempt++) {
        if (predicate()) return;
        await new Promise(resolve => setTimeout(resolve, 20));
    }
    throw new Error("Timed out waiting for application completion");
}
let checks;
function check(condition, message) {
    if (!condition) throw new Error(message);
    checks++;
}
async function start(picker) {
    window.fixturePicker = picker;
    const response = await fetch("/lp5.lp5/lp5.out");
    check(response.ok, "Generated output is served");
    const html = await response.text();
    const bootstrap = '<script>window.showDirectoryPicker = () => parent.fixturePicker();' +
        'window.LP5.util.indexedDB.storeDirectoryHandle = async () => {};<\/script>';
    check(html.includes('<script type="module">'), "Startup module exists");
    const loaded = new Promise(resolve => frame.addEventListener("load", resolve, {once: true}));
    frame.srcdoc = html.replace('<script type="module">', bootstrap + '<script type="module">');
    await loaded;
    check(frame.contentDocument.querySelector("#SelectCreateProject-dialog:modal"), "Startup dialog opens");
}
function select() {
    frame.contentDocument.getElementById("SelectCreateProject-Select").click();
}
button.addEventListener("click", async () => {
    button.disabled = true;
    checks = 0;
    try {
        let pickCount = 0, release;
        const directory = {kind: "directory", name: "fixture.lp5", async getFileHandle(filename) {
            check(filename === "fixture.lp5", "Root filename used");
            await new Promise(resolve => release = resolve);
            return {async getFile() { return new File(["<template><heading>Loaded</heading></template>"], filename); }};
        }};
        await start(() => { pickCount++; return Promise.resolve(directory); });
        select();
        check(pickCount === 1, "Picker starts synchronously with Select");
        await tick();
        const doc = frame.contentDocument, model = frame.contentWindow.LP5.model;
        check(release && model.rootFilename === null, "Model is loading");
        check(doc.querySelector("#SelectCreateProject-dialog:modal"), "Dialog remains modal while loading");
        select();
        check(pickCount === 1, "Select ignored while loading");
        release();
        await until(() => model.rootFilename !== null || doc.querySelector('dialog[role="alertdialog"]'));
        check(model.rootFilename === "fixture.lp5", "Model is fully loaded");
        check(model.getArticle("fixture.lp5").document.querySelector("heading").textContent === "Loaded", "Root parsed");
        check(!doc.getElementById("SelectCreateProject-dialog"), "Dialog removed on success");
        check(doc.querySelectorAll("body > style").length === 0, "Mounted dialog styles removed");
        check(!doc.querySelector('dialog[role="alertdialog"]'), "Success produces no fatal error");

        pickCount = 0;
        await start(() => {
            pickCount++;
            return Promise.reject(new DOMException("Aborted", "AbortError"));
        });
        select(); await tick();
        check(frame.contentDocument.querySelector("#SelectCreateProject-dialog:modal"), "Abort retains dialog");
        select(); await tick();
        check(pickCount === 2, "Select can retry after abort");

        await start(() => Promise.resolve({kind: "directory", name: "broken.lp5", async getFileHandle() {
            throw new DOMException("Cannot read fixture", "AbortError");
        }}));
        select();
        await until(() => frame.contentDocument.querySelector('dialog[role="alertdialog"]'));
        const fatal = frame.contentDocument.querySelector('dialog[role="alertdialog"]');
        check(fatal?.matches(":modal"), "Loading error produces fatal modal");
        check(fatal.textContent.includes("Cannot read 'broken.lp5'"), "Loading error has filename context");
        check(frame.contentWindow.LP5.model.rootFilename === null, "Failed load leaves model empty");
        await start(() => { throw new Error("Remote selection must not invoke picker"); });
        const remoteDoc = frame.contentDocument;
        const remoteWindow = frame.contentWindow;
        const projectURL = new URL("/test/storage-project.lp5/", location.href).href;
        const http = remoteWindow.LP5.storage.remote.open(projectURL);
        check(http.root_filename === "storage-project.lp5", "Remote root follows directory-name convention");
        await http.store("storage-project.lp5", '<template><children><li id="1.lp5"/></children><heading>Remote root</heading></template>');
        await http.store("1.lp5", '<template><heading>Remote child</heading></template>');
        const remoteRadio = remoteDoc.getElementById("SelectCreateProject-Remote");
        remoteRadio.click();
        check(!remoteDoc.getElementById("SelectCreateProject-RemoteField").hidden, "Remote URL field appears");
        check(remoteDoc.getElementById("SelectCreateProject-Create").disabled, "Remote creation disabled");
        check(!remoteDoc.querySelector('input[id*="Root"]'), "No root-filename override");
        select();
        check(remoteDoc.getElementById("SelectCreateProject-dialog"), "Empty URL cannot start selection");
        remoteDoc.getElementById("SelectCreateProject-Local").click();
        check(remoteDoc.getElementById("SelectCreateProject-RemoteField").hidden, "Local hides URL field");
        check(!remoteDoc.getElementById("SelectCreateProject-Create").disabled, "Local restores Create");
        remoteRadio.click();
        remoteDoc.getElementById("SelectCreateProject-URL").value = projectURL;
        select();
        await until(() => remoteWindow.LP5.model.rootFilename !== null || remoteDoc.querySelector('dialog[role="alertdialog"]'));
        check(remoteWindow.LP5.model.rootFilename === "storage-project.lp5", "Remote root loaded via HTTP");
        check([...remoteWindow.LP5.model.docOrder()].length === 2, "Remote child links loaded");
        check(remoteWindow.LP5.model.getArticle("1.lp5").document.querySelector("heading").textContent === "Remote child", "Remote child content parsed");
        check(!remoteDoc.getElementById("SelectCreateProject-dialog"), "Remote success removes dialog");
        await http.remove("1.lp5");
        await http.remove("storage-project.lp5");
        report.textContent = `PASS: ${checks} assertions; local selection/loading, abort/retry, fatal errors, and remote HTTP selection/loading.`;
    } catch (error) {
        report.textContent = "FAIL: " + error.stack;
    } finally {
        button.disabled = false;
        delete window.fixturePicker;
    }
});
</script>
