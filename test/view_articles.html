<!doctype html>
<meta charset="utf-8">
<title>LP5 article display tests</title>
<button id="run">Test article display</button>
<pre id="results">Choose the test.</pre>
<iframe id="app" title="Generated LP5 application" style="width:100%;height:560px"></iframe>
<script type="module">
const frame = document.getElementById("app");
const report = document.getElementById("results");
const button = document.getElementById("run");
let checks;
function check(condition, message) {
    if (!condition) throw new Error(message);
    checks++;
}
async function until(predicate) {
    for (let i = 0; i < 100; i++) {
        if (predicate()) return;
        await new Promise(resolve => setTimeout(resolve, 20));
    }
    throw new Error("Timed out waiting for display");
}
const literal = text => "<![CDATA[" + text + "]]>";
const sourceCode = '<scr' + 'ipt>window.sourceExecuted = true;</scr' + 'ipt>\n<em>code & text</em>\n';
const reference = '<lp5- ref="Shared"/>';
const longCode = Array.from({length: 80}, (_, i) => "line " + i + " " + "long text ".repeat(30)).join("\n");
const originalRoot = '<template><children><li id="1.lp5"/><li id="2.lp5"/></children>' +
    '<heading>Root &amp; &lt;display&gt;</heading>' +
    '<section data-lp5-kind="explanation"><p>Read <strong>this</strong>.</p>' +
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 30"><rect width="80" height="30" fill="teal"/></svg></section>' +
    '<section data-lp5-kind="code"><name>Root code</name><code>' + literal(sourceCode) + reference +
    literal("\nlast line") + '</code></section></template>';
button.addEventListener("click", async () => {
    checks = 0;
    button.disabled = true;
    try {
        const files = {
            "fixture.lp5": originalRoot,
            "1.lp5": '<template><section data-lp5-kind="explanation"><p>Child explanation</p></section></template>',
            "2.lp5": '<template><heading>Code only</heading><section data-lp5-kind="code">' +
                '<name>Shared</name><code>' + literal(longCode) + '</code></section></template>'
        };
        window.displayFixture = {kind: "directory", name: "fixture.lp5", async getFileHandle(filename) {
            if (!(filename in files)) throw new Error("Missing " + filename);
            return {async getFile() { return new File([files[filename]], filename); }};
        }};
        const response = await fetch("/lp5.lp5/lp5.out");
        check(response.ok, "Generated output served");
        const html = await response.text();
        const bootstrap = '<script>window.showDirectoryPicker = async () => parent.displayFixture;' +
            'window.LP5.util.indexedDB.storeDirectoryHandle = async () => {};<\/script>';
        const loaded = new Promise(resolve => frame.addEventListener("load", resolve, {once: true}));
        frame.srcdoc = html.replace('<script type="module">', bootstrap + '<script type="module">');
        await loaded;
        const doc = frame.contentDocument, win = frame.contentWindow;
        const {model, storage} = win.LP5;
        const pane = doc.getElementById("LP5-Source");
        check(pane.children.length === 0, "Source starts empty");
        doc.getElementById("SelectCreateProject-Select").click();
        await until(() => !doc.getElementById("SelectCreateProject-dialog") || doc.querySelector('dialog[role="alertdialog"]'));
        check(!doc.querySelector('dialog[role="alertdialog"]'), "Selection and rendering succeed");
        const articles = [...pane.children];
        check(articles.length === 3, "All reachable articles displayed");
        check(articles.map(a => a.dataset.lp5Filename).join() === "fixture.lp5,1.lp5,2.lp5", "Display follows model document order");
        check(articles[0].querySelector("h2").firstChild.textContent === "Root & <display>", "Heading is literal text");
        check(articles[0].querySelector("h2 small").textContent === "fixture.lp5", "Title includes filename");
        check(articles[1].querySelector("h2").textContent === "1.lp5", "Untitled article uses filename");
        check(articles[0].querySelector(".LP5-Explanation strong").textContent === "this", "Explanation markup rendered");
        check(articles[0].querySelector("svg").namespaceURI === "http://www.w3.org/2000/svg", "SVG stays vector markup");
        check(articles[0].querySelector(".LP5-CodeName").textContent === "Root code", "Code name displayed");
        check(articles[0].querySelector("pre code").textContent === sourceCode + reference + "\nlast line", "Literal code and references retain order and text");
        check(!articles[0].querySelector("pre script, pre em, pre lp5-"), "Code is not interpreted as HTML");
        check(win.sourceExecuted === undefined, "Source scripts do not execute");
        check(!articles[1].querySelector("pre"), "Explanation-only article needs no code block");
        check(!articles[2].querySelector(".LP5-Explanation"), "Code-only article needs no explanation block");
        const pre = articles[2].querySelector("pre");
        check(pre.textContent === longCode, "Long multiline code preserved");
        check(!["auto", "scroll"].includes(win.getComputedStyle(pre).overflowY), "Code block has no vertical scroll container");
        check(pane.scrollHeight > pane.clientHeight, "Source pane owns vertical scrolling");
        check(win.getComputedStyle(pre).whiteSpace === "pre", "Code lines do not wrap");
        check(win.getComputedStyle(pre).overflowX === "auto", "Horizontal scrollbar is conditional");
        check(pre.scrollWidth > pre.clientWidth, "Long lines overflow within their code block");
        check(pre.scrollHeight <= pre.clientHeight + 1, "All code lines fit without vertical clipping");
        check(pane.scrollWidth <= pane.clientWidth + 1, "Code does not widen the Source Pane");
        pre.scrollLeft = 100;
        check(pre.scrollLeft > 0, "Long code can scroll horizontally");
        const initialWidth = pre.clientWidth;
        pane.style.flex = "0 0 180px";
        await new Promise(resolve => win.requestAnimationFrame(resolve));
        const narrowWidth = pre.clientWidth;
        check(narrowWidth < initialWidth && pre.scrollWidth > pre.clientWidth, "Code follows a narrower pane");
        check(pre.scrollHeight <= pre.clientHeight + 1, "Narrowing leaves every code line visible");
        pane.style.flex = "0 0 600px";
        await new Promise(resolve => win.requestAnimationFrame(resolve));
        check(pre.clientWidth > narrowWidth, "Code follows a wider pane");
        check(pre.scrollHeight <= pre.clientHeight + 1, "Widening leaves every code line visible");
        pane.style.flex = "";

        const originalDocument = model.getArticle("fixture.lp5").document;
        articles[0].querySelector("strong").textContent = "Edited display";
        check(originalDocument.querySelector("strong").textContent === "this", "Rendered markup is independent of model XML");
        check(originalDocument.querySelector("code").childNodes.length === 3, "Rendering leaves source CDATA and reference nodes intact");
        pane.scrollTop = 100;
        files["fixture.lp5"] = '<template><heading>Reloaded</heading><section data-lp5-kind="code"><name/><code>' + literal("replacement") + '</code></section></template>';
        await model.loadProject();
        check(pane.children.length === 1, "Reload replaces rather than appends articles");
        check(pane.querySelector("h2").firstChild.textContent === "Reloaded", "Reload displays new heading");
        check(pane.querySelector("pre").textContent === "replacement", "Reload displays new code");
        const shortCode = pane.querySelector("pre");
        check(shortCode.scrollWidth <= shortCode.clientWidth + 1, "Short code needs no horizontal scrollbar");
        check(shortCode.scrollHeight <= shortCode.clientHeight + 1, "Short code needs no vertical scrollbar");
        check(pane.querySelector(".LP5-CodeName").textContent === "Unnamed code", "Unnamed bundle has a readable label");
        check(pane.scrollTop === 0, "Reload resets source scroll position");
        check(!articles[0].isConnected, "Old display is detached");
        await model.selectProject(storage.local.open({kind: "directory", name: "other.lp5", async getFileHandle() {
            return {async getFile() { return new File(["<template/>"], "other.lp5"); }};
        }}));
        await model.loadProject();
        check(pane.children.length === 1 && pane.firstElementChild.dataset.lp5Filename === "other.lp5", "Different project replaces prior display");
        check(pane.querySelector("h2").textContent === "other.lp5", "Empty article still has a filename heading");
        check(doc.querySelectorAll("#LP5-Toc .LP5-TocEntry").length === 1 && !doc.getElementById("LP5-Output").children.length,
            "TOC tracks the new project while expanded output remains empty");
        files["fixture.lp5"] = originalRoot;
        await model.selectProject(storage.local.open(window.displayFixture));
        await model.loadProject();
        report.textContent = `PASS: ${checks} assertions; startup rendering, source fidelity, SVG, scrolling, and reload replacement.`;
    } catch (error) {
        report.textContent = "FAIL: " + error.stack;
    } finally {
        button.disabled = false;
        delete window.displayFixture;
    }
});
</script>
