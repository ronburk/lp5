         span.BLMullionGrip::after {

         .BLMullion {
             border: dashed 1px #aaaaaa;
         }

        <script>
         function assert(Condition, Message) {
             if(!Condition){
                 Message = Message || "Assertion failed.";
                 if(typeof Error !== "undefined"){
                     throw new Error(Message);
                 }
                 throw Message;
             }
         }
         function VirtualFunctionMissing(){assert(false);}

         var Log = console.log;

         var DB  = function(){
             var Export   = {};
             Export.IndexedDB  = window.indexedDB;
             function Init(){
                 Log("DB.Init()");
             }
             // Get() - bring object into memory, given its ID
             function Get(ID){
                 Log("DB.Get()");
                 return null;
             }
             Export.Get  = Get;
             Export.Init = Init;

             return Export;
         }();

         var BLPages = function(){
             var Export    = {};       // the object we return
             var PageNames = {};       // ["page_name"] = layout_object
             var PageName  = null;

             Export.Add = function(Name, Layout){
                 Log("Adding '" + Name + "'");
                 assert(!(Name in PageNames));
                 PageNames[Name] = Layout;
                 assert(Name in PageNames);
             }
             Export.Render = function(PageName) {
                 Log("Export.Render(" + PageName + ")");
                 Log("PageName in PageNames = " + PageName in PageNames);
                 assert(PageName in PageNames);
                 var Layout = PageNames[PageName];
                 Log("Layout = " + Layout);
                 var Div    = Layout.Render();
                 Log("Div = " + Div);
                 
                 var Replaced = document.body.replaceChild(Div, document.body.firstChild);
                 assert(Replaced);
                 Div.style.display='flex';
                 
             };
             return Export;
         }();

         var Layout = {
             'Cache': null,
             'DragStart': VirtualFunctionMissing,
             'handleEvent': function(e){
                 Log("Layout.handleEvent("+e+")");
             },
             'Render': VirtualFunctionMissing,
             'DefaultInnerHTML': VirtualFunctionMissing,
             'Load': function(){
                 var Result = this.Cache;
                 var iChild, Child, Children;
                 if(!Result){
                     // top-level div is dummy parent never displayed -- code becomes
                     // more uniform if can treate all "real" nodes as children
                     Result = document.createElement("div");
                     Result.style.display = 'none';   // Page will decide when to show it
                     Result.innerHTML = this.DefaultInnerHTML();
                     this.Cache = Result;
                     Log("this.cache = " + Result);
                     // set up event handlers
                     Children = Result.querySelectorAll("div");
                     for(iChild = 0; iChild < Children.length; ++iChild){
                         Child = Children[iChild];
                         if(Child.classList.contains('BLPane'))
                             Child.addEventListener('dragstart', this);
                         //                     if(Child.classList.contains(
                     }
                     this.Cache = Result.firstElementChild;
                     Result = this.Cache;
                 }
                 return Result;
             }
         };

         var LayoutMain = function(){
             var Result = Object.create(Layout);
             Result.DefaultInnerHTML = function(){
                 return "<div class='BLPane'>"
                      + "<div class='BLPane' style='width:48%;'>Left</div>"
                      + "<div draggable='true' class='BLMullion' style='width:2%;'><span class='BLMullionGrip'></span></div>"
                      + "<div class='BLPane' style='width:48%'>R</div>"
                      + "</div>";
             }
             
             // Render() - 
             Result.Render = function () {
                 var Result;
                 Log("LayoutMain does render.");
                 Result =  this.Load();
                 assert(Result && Result.nodeType);

                 Log("Result.Render to return '" + Result + "'");
                 // need to give children a chance to render
                 return Result;
             }
             return Result;
         }();
         // view methods
         function ViewPage(HtmlElement){
             
         }


         // main entry point
         window.onload = function BLOnLoad(){
             "use strict";
             return;
             BLPages.Add("", LayoutMain);
             BLPages.Render("");

             // die quick if browser does not supply our needs
             // could maybe cookie-store previous success and skip this function
             // could maybe also only load this code froms server if needed
             // but what if user updated browser? must also store browser name string?
             // Can be done before load of body
             (function (){
                 var Message = "";
                 if(typeof(Event) != 'function')
                     Message = "Event objects.";
                 if(!window.indexedDB)
                     Message = "Indexed DB";
                 if(!BLOnLoad.hasOwnProperty("name"))
                     Message = "function.name property";
                 if(Message != ""){
                     Message = "This browser lacks support for feature I need: '"
                             + Message + "'";
                     throw { name: "Incompatible browser:", message: Message };
                 }
             })();


             // factory registry to connect HTML elements to JS objects
             //         const Registry = {
             //             "BLPage":     { 
             //         };


             function EventDefaultHandler(e){
                 Log("EventDefaultHandler!");
             }
             function InitEventHandlers(){
                 const EventMap =
                     [
                         [ EventDefaultHandler, "keydown", "body" ],
                     ];
                 EventMap.forEach(function(EventConnection){
                     const Elements = document.querySelectorAll(EventConnection[2]);
                     if(Elements)
                         Elements.forEach(function(Element){
                             Element.addEventListener(EventConnection[1], EventConnection[0]);
                         });
                 });
             }
             
         }
        </script>
