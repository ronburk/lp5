<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
                            <meta charset="utf-8">
                            <title>blitpro bootstrap</title>
                            <style>
                                              body {
                     display: grid;
                     grid-template-areas:
                         "menu menu menu"
                         "toc source output"
                         "footer footer footer";
                     grid-template-rows: 60px 3fr 60px;
                     grid-template-columns: 1fr 3fr 1fr;
                     grid-gap: 10px;
                     height: 100vh;    /* fill the height of the window    */
                     margin: 0;        /* no gaps between body and content */
                 }
                                 #BL-Menu   { grid-area: menu;   }
                 #BL-Toc    { grid-area: toc;    }
                 #BL-Source { grid-area: source; }
                 #BL-Output { grid-area: output; }
                 #BL-Footer { grid-area: footer; }
                                 #BL-Menu {
                     height:50px;
                     background:#F0F0F0;
                     border:1px solid #CCC;
                 }
                 #BL-Menu ul {
                     display: flex;
                     align-items: center;
                     list-style: none;
                     background-color: #F0F0F0;
                     color: #11F;
                 }
                 #BL-Menu li {
                     margin-left: 20px;
                     cursor: pointer;
                     transition: .5s;
                 }
                 #BL-Menu li:hover {
                     color: red;
                 }
                                 #BL-Toc a {text-decoration: none;}
                 #BL-Toc a:visited { color: rgb(0,0,238); }
                 #BL-Toc {
                     font-family: Helvetica;
                     background-color: #F9F9FF;
                 }
                 #BL-Toc h1 {
                     margin: inherit;
                     cursor: pointer;
                     font-size: 18px;
                 }
                 #BL-Toc h2 {
                     text-indent: 5%;
                     margin: inherit;
                     cursor: pointer;
                     font-size: 15px;
                 }
                 #BL-Toc h3 {
                     text-indent: 10%;
                     margin: inherit;
                     cursor: pointer;
                     font-size: 15px;
                 }
                                 #BL-Source{
                     background-color: #FFFFEB;
                     overflow: auto;
                     display: flex;
                     flex-flow: column;
                     align-items: stretch;
                 }
                 .BL-Section{
                     border-bottom: 1px dotted  #a5c8ba;
                     padding-right: 5px;
                     padding-left: 5px;
                     background-color: #FFFFEF;
                     width: auto;
                 }
                 .BL-Code {
                     font-family: "Consolas", monospace;
                     white-space: pre;
                     background-color: #FFFFFF;
                     border-top:2px solid #FFFF00;
                     margin-left: -4px;
                     line-height: 100%;
                 }
                 .BL-Code p {
                     margin: 0;
                 }
                 .BL-Code-Ref {
                     background-color: #FFFFEB;
                     font-family: "Verdana", "Arial", Gadget, sans-serif;
                     white-space: normal;
                 }
                 .BL-CodeName {
                     font-family: "Arial", Gadget, sans-serif;
                     background-color: #F9FFF0;
                     word-wrap: break-word;
                     white-space: normal;
                 }
                 .BL-CodeNameBrackets { font-family: monospace; }
                 .BL-Comment{
                     background-color: #FFFFEB;
                 }
                 .BL-Comment h1 {
                     margin: .2em 0 .2em 0;
                 }
                 .BL-Comment h2 {
                     margin: .15em 0 .15em 0;
                 }
                 .BL-Comment h3 {
                     margin: .1em 0 .1em 0;
                 }
                                 .BL-Code {
                     font-family: "Consolas", monospace;
                     white-space: pre;
                     background-color: #FFFFFF;
                     border-top:  2px solid #FFFF00;
                     margin-left: -4px;
                     line-height: 100%;
                 }
                 .BL-Code-Ref {
                     background-color: #FFF0F0;
                     font-family: "Arial Black", Gadget, sans-serif;
                 }
                 .BL-CodeName {
                     font-family: "Arial Black", Gadget, sans-serif;
                     background-color: #FFF0F0;
                 }
                 .BL-CodeNameBrackets {
                     font-family: monospace;
                 }
                
                            </style>
                            <script type="text/javascript">
                            "use strict";
                            debugger;
                                                              var BL = {
                     index: null,             /* primary data structure */
                     masterTemplate: null,    /* DOM node of source 'template' element */
                     eventMap: {
                         "click": {
                                              "BL-Menu-Compile": (event => BL.compile(event)),
                                 ".BL_Comment":    (event => BL.editDoc(event)),
                
                         },
                     },
                                      onload: function (){
                     let masterTemplate = document.getElementById("BL").content;
                     console.log("master template is:");
                     console.log(masterTemplate);
                     BL.masterTemplate = masterTemplate;
                     console.assert(masterTemplate, "Missing #BL!");
                     BL.indexCreate(masterTemplate);
                     let sourceDiv = document.getElementById("BL-Source");
                     let tocDiv    = document.getElementById("BL-Toc");
                     for(let section of BL.index.sectionNodes){
                         BL.sectionAppend(sourceDiv, section);
                         BL.tocAppend(tocDiv, section);
                     }
                     document.body.onclick = (event => BL.click(event));
                 }
                ,
                                      indexCreate: function (masterTemplate){
                     let idText       = {};  // idText[id] = "html string";
                     let sectionNodes = [];
                     let codeObjects  = {};
                     let childNodes   = masterTemplate.childNodes;
                     let section      = null;
                     // for each section
                     for(let childNode of childNodes){
                         // if it's our table of ID/descriptions
                         if(childNode.tagName == "UL"){
                             for(let listItem of childNode.childNodes){
                                 if(listItem.tagName == "LI"){
                                     idText[listItem.id] = listItem.innerHTML;
                                 }
                             }
                         }
                         // else, if it's a section
                         else if((section = BL.indexSection(childNode)) != null){
                             sectionNodes.push(section);
                             if(section.code){
                                 let node         = section.code;
                                 let codeObjectId = BL.getCodeId(node);
                                 console.log("found code ID '" + codeObjectId + "'");

                                 if(codeObjects.hasOwnProperty(codeObjectId))
                                     codeObjects[codeObjectId].push(section.code);
                                 else
                                     codeObjects[codeObjectId] = new Array(section.code);
                                 if(section.codeName)
                                     idText[codeObjectId] = section.codeName.innerHTML.trim();
                             }
                         }
                     }
                     let result = {
                         masterTemplate: masterTemplate,
                         sectionNodes:   sectionNodes,
                         codeObjects:    codeObjects,
                         idText:         idText,
                         tocDiv:         document.getElementById("BL-Toc"),
                         sourceDiv:      document.getElementById("BL-Source")
                     };
                     return BL.index = result;
                 }
                ,
                     indexSection:                  function indexSection(node){
                     let result   = null;  // assume failure
                     if(node.tagName == "SECTION"){
                         let child = node.firstElementChild;
                         // ignore inexplicably empty section
                         if(child){
                             result = {node:node, comment:null, code:null, codeName:null};

                             for(; child; child=child.nextSibling)
                                 switch(child.tagName){
                                     case "DIV"  :
                                         if(result.comment)
                                             console.warn("Ignoring unexpected div in section.");
                                         else
                                             result.comment = child;
                                         break;
                                     case "SCRIPT" :
                                     case "STYLE" :
                                         if(result.code)
                                             console.warn("ignoring unexpected script in section.");
                                         else{
                                             result.code = child;
                                             result.codeType=child.tagName;
                                         }
                                         break;
                                     case "HEADER" :
                                         result.codeName = child;
                                         break;
                                     case "SECTION" :
                                         console.error("Found section inside section. Probably a mistake.");
                                 }
                         }
                     }
                     else
                         console.warn("Found empty section.");
                     return result;
                 }
                ,
                     getCodeId:                  function (codeNode){
                     // treat missing 'data-BL' same as blank (root section).
                     let result = " ";
                     if(codeNode.hasAttribute("data-BL"))
                         result = codeNode.getAttribute("data-BL");
                     return result;
                 }
                ,
                     sectionAppend:                  function (sourceDiv, section){
                     let outerDiv = document.createElement("div");
                     outerDiv.className = "BL-Section";
                     outerDiv.id        = section.node.id;
                     if(section.comment){
                         let commentDiv = section.comment.cloneNode(true);
                         commentDiv.className = "BL-Comment";
                         outerDiv.appendChild(commentDiv);
                         BL.tocAppend(section);
                     }
                     if(section.code){
                         let codeDiv = document.createElement("div");
                         codeDiv.className = "BL-Code";
                         let id = BL.getCodeId(section.code);
                         console.log("id = '" + id + "'");
                         BL.createCodeNameHtml(codeDiv, id);
                         BL.textAppend(codeDiv, section.code.innerHTML);
                         outerDiv.appendChild(codeDiv);
                     }
                     sourceDiv.appendChild(outerDiv);
                 }
                ,
                                      tocAppend: function(section){
                     let commentDiv = section.comment;
                     if(commentDiv){
                         // will append first <h*> tag (if any) to TOC.
                         for(let childNode of commentDiv.children)
                             if(childNode.tagName.match(/^[Hh][0-9]$/)){
                                 let headerClone = childNode.cloneNode(false);
                                 let id = section.node.id;
                                 let anchor = BL.cloneRename(childNode, "a");
                                 if(id)
                                     anchor.href = "#" + section.node.id;
                                 headerClone.appendChild(anchor);
                                 BL.index.tocDiv.appendChild(headerClone);
                                 break;
                             }
                     }
                 }
                ,
                     cloneRename:                  function(node, newName){
                     let newParent = document.createElement(newName);
                     for(let childNode of node.childNodes){
                         newParent.appendChild(childNode.cloneNode(true));
                     }
                     return newParent;
                 }
                ,
                     createCodeNameHtml:                  function (parentDiv, codeId){
                     //                 console.log("createCodeNameHtml: '" + codeId + "'");
                     if(codeId != " "){
                         let arity = BL.index.codeObjects[codeId].length;
                         let suffix= "&#x3009;"; // 
                         if(arity > 1)
                             suffix += "&#x2795;";
                         suffix += "&#x2630;";
                         let para  = document.createElement("p");
                         let span  = BL.createSpanHtml("BL-CodeNameBrackets", "&#x3008;");
                         para.appendChild(span);
                         span = BL.createSpanHtml("BL-CodeName", BL.index.idText[codeId]);
                         para.appendChild(span);
                         span  = BL.createSpanHtml("BL-CodeNameBrackets", suffix);
                         para.appendChild(span);
                         parentDiv.appendChild(para);
                     }
                 }
                ,
                     createSpanHtml:                  function (className, innerHTML, tag="span"){
                     let result = document.createElement(tag);
                     result.className = className;
                     result.innerHTML = innerHTML;
                     return result;
                 }
                ,
                     textAppend:                  function BL_textAppend(parentDiv, text){
                     let indent = null;
                     let lex    = BL.tokenizer(text);
                     for(let token of lex){
                         // if first non-empty line, establish amount of input over-indent.
                         if(!indent && token != '\n'){
                             indent = token.slice(0, token.search(/\S|$/));
                             indent = new RegExp("^" + indent);
                         }

                         if(indent)
                             token = token.replace(indent, "");
                         let element = null;
                         if(token == '\n')
                             element = document.createElement("br");
                         else if(0 == token.search(/^[@]<.*@>$/)
                                 && token != "@" + "<@template@>"){
                             let id=token.slice(2,-2);
                             element = document.createElement("span");
                             element.className = "BL-Code-Ref";
                             element.innerHTML = '\u00AB' + BL.index.idText[id] + '\u00BB';
                         }
                         else if(0 == token.search(/^#[0-9A-Fa-f]+;/)){
                             element = document.createElement("span");
                             element.innerHTML = token;
                             let cssColor = BL.getCssColor(token);
                             element.style.cssText = cssColor;
                         }
                         else
                             element = document.createTextNode(token);
                         parentDiv.appendChild(element);
                     }
                 }
                ,
                     tokenizer:                  function * BL_tokenizer(text){
                     let scrap="";
                     let curPos=0, firstPos=0, maxPos = text.length;
                     if(text.charAt(0) == '\n')
                         curPos = firstPos = 1;
                     for(; curPos < text.length; ++curPos){
                         switch(text.charAt(curPos)){
                             case '\n':
                                 if(curPos > firstPos)
                                     yield text.slice(firstPos, curPos);
                                 yield "\n";
                                 break;
                             case '&': //??? unaware what context we're in, I think
                                 let pattern = /&lt;(\/script|script )/;
                                 scrap = text.slice(curPos, curPos+11);
                                 //  console.log("---scrap = '" + scrap + "'");
                                 if(scrap.match(pattern)){
                                     if(curPos > firstPos)
                                         yield text.slice(firstPos, curPos);
                                     console.log("rewrite: '" + "<" + scrap.slice(4) + "'");
                                     yield "<" + scrap.slice(4);
                                     curPos += (11-1);
                                     break;
                                 }
                                 // else, accumulate
                                 continue;
                                 break;
                             case '#' :
                                 // might be HTML color
                                 scrap = text.slice(curPos, curPos+2+6);
                                 let match = scrap.match(/^#[0-9A-Fa-f]+;/);
                                 if(match && (match[0].length == 5 || match[0].length == 8)){
                                     if(curPos > firstPos)
                                         yield text.slice(firstPos, curPos);
                                     yield match[0];
                                     curPos += (match[0].length - 1);
                                     break;
                                 }
                                 // else, accumulate
                                 continue;
                             case '@' :
                                 // might be code reference ??? need more rigorous match!
                                 if(text.charAt(curPos+1) == '<'){
                                     let matchPos = text.slice(curPos+1).indexOf("@>");
                                     if(matchPos != -1){
                                         // OK, we have a reference
                                         if(curPos > firstPos)
                                             yield text.slice(firstPos, curPos);
                                         yield text.slice(curPos, curPos+matchPos+3);
                                         curPos += matchPos+2;
                                         break;
                                     }
                                 }
                                 // else, accumulate
                                 continue;
                             default: // accumulate
                                 continue;
                         }
                         firstPos = curPos+1;
                     }
                     // if we've accumulated text we haven't emitted
                     if(curPos > firstPos)
                         yield text.slice(firstPos, curPos);
                 }
                ,
                     getCssColor:                  function(token){
                     let r, g, b, match, result = "background-color: " + token;
                     if(token.length == 5){
                         match = token.match(/^#([0-9A-Fa-f])([0-9A-Fa-f])([0-9A-Fa-f]);$/);
                         r = match[1] + match[1];
                         g = match[2] + match[2];
                         b = match[3] + match[3];
                     }
                     else{
                         match = token.match(/^#([0-9A-Fa-f][0-9A-Fa-f])([0-9A-Fa-f][0-9A-Fa-f])([0-9A-Fa-f][0-9A-Fa-f]);$/);
                         r = match[1];
                         g = match[2];
                         b = match[3];
                     }
                     r = parseInt(r,16); g = parseInt(g,16); b = parseInt(b,16);
                     let brightness = (r + r + b + g + g + g)/6;
                     if(brightness > 100){
                         result += " color : black";
                     }
                     else
                         result += " color : white";
                     return result;
                 }
                ,
                     click:                  function(event){
                     let handler  = null;
                     let category = BL.eventMap[event.type];
                     if(category)
                         handler = category[event.target.id];
                     if(handler)
                         handler(event);
                     else
                         console.log("no click handler for that");
                 }
                ,
                     editDoc:                  function(event){
                     alert("Edit doc!");
                 }
                ,
                 };
                
                 window.onload = BL.onLoad;
                
                                </script>
                        </head>
                        <body>
                            <template id="BL">
            <ul>
                <li>BL v0.0: bootstrap</li>
                <li>Define HTML head/body</li>
                <li id="BL_1">Top-most Menu</li>
                <li id="BL_2">Outermost Three-column Grid</li>
                <li id="BL_GlobalCSS">Global CSS</li>
                <li id="BL_GlobalJavascript">Global Javascript</li>
                <li id="BL_MainGrid">Main Grid</li>
                <li id="BL_GridAreas">Define grid &lt;div&gt;s</li>
                <li id="BL_MainObject">Define main BL object</li>
                <li id="BL_OnLoad">onLoad() handler (main execution entry point)</li>
                <li id="BL_Copy_Template_From_Opener">
                </li>
            </ul>
            <!-- Source is divided into sections, which are numbered sequentially.
                 Each section has three parts in a specific order:
                 * Comments (written in HTML)
                 * Macros   (written in who knows what!)
                 * Code     (written in HTML or JavaScript or CSS)
                 At least one of these parts must be present.
            -->
            <section id="BL_Section_0">
                <div>
                    <h1>blitpro v0.0</h1>
                    <p>
                        This is the simplest/smallest possible version of blitpro
                        (Burk Labs lITerary PROgramming tool),
                        an IDE for literate programming with HTML5
                        (HTML, CSS, and JavaScript).
                        It offers the ability to <em>view</em>
                        a blitpro program and little else.
                        It is mainly of use for building a better
                        version of blitpro,
                        since blitpro is written in blitpro,
                        as will be described later.
                    </p>
                </div>
            </section>
            <section id="BL_Overview">
                <div>
                    <h2>Overview</h2>
                    <p>
                        A blitpro program consists of a series of
                        <q>sections,</q>
                        where each section contains documentation
                        or code fragments or both
                        (the section you are currently reading contains only
                        documentation).
                    </p>
                    <p>
                        The order of the sections is the order the
                        author deems most conducive to explaining
                        the code,
                        and is independent of the order of the code
                        in the final HTML output
                        (which is produced by asking blitpro to <q>compile</q>).
                        By convention,
                        most sections are quite short
                        and often contain not much more than a dozen
                        lines of code.
                    </p>
                    <b>documentation fragments:</b>
                    <p>
                        The documentation portion of a section is
                        written in normal HTML.
                        The first headline element
                        (<code>&lt;h1&gt;</code>, <code>&lt;h2&gt;</code>, etc.),
                        if any,
                        in the documentation portion of the section
                        will be copied to the <q>table of contents</q>
                        pane on the left,
                        with appropriate indentation.
                        There, you can click on the headline text of a section to scroll
                        to that section of your code.
                    </p>
                    <b>code fragments:</b>
                    <p>
                        The code fragment portion of a section is written
                        in a language nearly identical to HTML5,
                        except that the code fragment may have a <em>name</em>,
                        and the code fragment may contain references to other
                        named code fragments.
                    </p>
                    <p>
                        Unnamed code fragments form the root of a directed
                        graph that is traversed to produce the final output HTML.
                        As each code fragment is copied to the output,
                        any reference to another code fragment causes the
                        copying to recurse.
                    </p>
                    <p>
                        Code fragments that share the same name will
                        be combined together in the output in the order
                        they appeared in the blitpro source sections.
                        This greatly alleviates the need to think of
                        unique names for each logical group of global variables,
                        CSS declarations, etc.
                    </p>
                </div>
            </section>
            <section id="BL_Section_1">
                <div>
                    <h2>Bootstrap</h2>
                    <p>
                        v0.0 of blitpro is really only intended for
                        operating on its own source code to
                        produce a more functional version of blitpro.
                        v0.0 is an HTML file that contains two
                        copies of the blitpro IDE.
                        One copy is the actual code that is
                        executing as you read this.
                        The other copy is a passive version
                        that is being operated on by the IDE.
                    </p>
                    <p>
                        This is only confusing because of self-reference.
                        blitpro is an HTML5 program that operates on text
                        (blitpro source code) residing in a particular
                        <code>&lt;template&gt;</code> tag. It just so happens
                        that the source code being operated on here is
                        the source to blitpro itself.
                    </p>
                    <div style="text-align:center;">

                    </div>
                    <p>
                        The practical consequence is that when you
                        edit the HTML source to this page,
                        you will find two copies of just about any
                        particular line of code.
                        To edit the actual source code to blitpro,
                        just make sure you edit the blitpro source that
                        resides inside the
                        <code>&lt;template&gt;</code>
                        tag in this HTML file.
                        When you reload this HTML file,
                        you will then be viewing the updated source code
                        that includes your changes.
                    </p>
                    <b>Creating v0.1</b>
                    <p>
                        Of course, editing the blitpro source code does
                        not actually change the functionality of this HTML page
                        (you're just editing text inside of a 
                        <code>&lt;template&gt;</code>
                        that the browser never parses).
                        To test your source code changes,
                        hit the <q>Compile</q> menu button at the top of the screen.
                        This will compile your blitpro source into HTML code in
                        a separate tab in your browser.
                        There, you can check to see if your changes work
                        as expected—the other window will also
                        contain a copy of your blitpro source code just like this
                        window does.
                    </p>
                    <p>
                        At some point, you will have added enough wonderful improvements
                        to blitpro that the fact that none of them show up until you hit
                        <q>Compile</q> will be tedious.
                        To upgrade this HTML file so that it implements your
                        latest blitpro source, just copy the <q>Output</q> pane to
                        the clipboard,
                        and use that to clobber this HTML file.
                        (Prudent backup, version control, etc. are recommended.).
                    </p>
                    <p>
                        Obviously, these somewhat primitive processes are just
                        features of the primitive state of bootstrapping blitpro and
                        hopefully will be replaced by a less tedious workflow
                        as a fuller functionality is reached.
                    </p>
                </div>

                    </p>
                    <p>

                    <p>
                        The CSS grid facility is used to define the
                        page layout.
                        <code>grid-template-areas</code>
                        lets you define the layout almost graphically.
                        For example, the <code>"menu menu menu"</code>
                        means that
                        the <q>menu</q> spans (all) three columns.
                    </p>
                </div>
                <style data-bl="BL_GlobalCSS">
                 body {
                     display: grid;
                     grid-template-areas:
                         "menu menu menu"
                         "toc source output"
                         "footer footer footer";
                     grid-template-rows: 60px 3fr 60px;
                     grid-template-columns: 1fr 3fr 1fr;
                     grid-gap: 10px;
                     height: 100vh;    /* fill the height of the window    */
                     margin: 0;        /* no gaps between body and content */
                 }
                </style>
            </section>
            <section id="BL_Page_Layout2">
                <div>
                    <p>
                        The named grid areas from the
                        <code>grid-template-areas</code> property
                        correspond to
                        <code>&lt;div&gt;</code>s
                        that are mostly very simple because
                        their content will be filled dynamically
                        from the blitpro source code being displayed:
                    </p>
                </div>
                <script type="text/html" data-bl="BL_GridAreas">

                            <li>Menu 4</li>
                        </ul>
                    </div>

                    </div>
                    <div id="BL-Source">
                    </div>

                 onload: function (){

                     BL.masterTemplate = masterTemplate;
                     console.assert(masterTemplate, "Missing #BL!");
                     BL.indexCreate(masterTemplate);
                     let sourceDiv = document.getElementById("BL-Source");

            <section id="BL_Create_Index">
                <div>
                    <h3>Create index of source template.</h3>
                    <p>
                        The
                        &lt;template&gt;
                        contains all the source (documentation and code fragments).
                        But it will be convenient to have various
                        paths to access the pieces of the source.
                        Here we construct <code>BL.index</code>,
                        sort of the <q>master data structure.</q>
                    </p>
                </div>
                <header>
                    Create <q>index</q> into the source &lt;template&gt;
                </header>
                <script type="text/plain" data-bl="BL_Create_Index">
                 indexCreate: function (masterTemplate){
                     let idText       = {};  // idText[id] = "html string";
                     let sectionNodes = [];
                     let codeObjects  = {};
                     let childNodes   = masterTemplate.childNodes;
                     let section      = null;
                     // for each section
                     for(let childNode of childNodes){
                         // if it's our table of ID/descriptions
                         if(childNode.tagName == "UL"){
                             for(let listItem of childNode.childNodes){
                                 if(listItem.tagName == "LI"){
                                     idText[listItem.id] = listItem.innerHTML;
                                 }
                             }
                         }
                         // else, if it's a section
                         else if((section = BL.indexSection(childNode)) != null){
                             sectionNodes.push(section);
                             if(section.code){
                                 let node         = section.code;
                                 let codeObjectId = BL.getCodeId(node);
                                 console.log("found code ID '" + codeObjectId + "'");

                                 if(codeObjects.hasOwnProperty(codeObjectId))
                                     codeObjects[codeObjectId].push(section.code);
                                 else
                                     codeObjects[codeObjectId] = new Array(section.code);
                                 if(section.codeName)
                                     idText[codeObjectId] = section.codeName.innerHTML.trim();
                             }
                         }
                     }
                     let result = {
                         masterTemplate: masterTemplate,
                         sectionNodes:   sectionNodes,
                         codeObjects:    codeObjects,
                         idText:         idText,
                         tocDiv:         document.getElementById("BL-Toc"),
                         sourceDiv:      document.getElementById("BL-Source")
                     };
                     return BL.index = result;
                 }
                </script>
            </section>

                <script type="text/html">
                    <!doctype html>

            <section id="BL_Section_Index_Section">
                <header>
                    Create data structures that index one <q>section</q> of source.
                </header>
                <script type="text/x-plain" data-bl="BL_Index_Section">
                 function indexSection(node){
                     let result   = null;  // assume failure
                     if(node.tagName == "SECTION"){
                         let child = node.firstElementChild;
                         // ignore inexplicably empty section
                         if(child){
                             result = {node:node, comment:null, code:null, codeName:null};

                             for(; child; child=child.nextSibling)
                                 switch(child.tagName){
                                     case "DIV"  :
                                         if(result.comment)
                                             console.warn("Ignoring unexpected div in section.");
                                         else
                                             result.comment = child;
                                         break;
                                     case "SCRIPT" :
                                     case "STYLE" :
                                         if(result.code)
                                             console.warn("ignoring unexpected script in section.");
                                         else{
                                             result.code = child;
                                             result.codeType=child.tagName;
                                         }
                                         break;
                                     case "HEADER" :
                                         result.codeName = child;
                                         break;
                                     case "SECTION" :
                                         console.error("Found section inside section. Probably a mistake.");
                                 }
                         }
                     }
                     else
                         console.warn("Found empty section.");
                     return result;
                 }
                </script>
            </section>
            <section id="BL_Section_Append">
                <header>
                    Append section div to source pane.
                </header>
                <script type="text/x-plain" data-bl="BL_Section_Append">
                 function (sourceDiv, section){
                     let outerDiv = document.createElement("div");
                     outerDiv.className = "BL-Section";
                     outerDiv.id        = section.node.id;
                     if(section.comment){
                         let commentDiv = section.comment.cloneNode(true);
                         commentDiv.className = "BL-Comment";
                         outerDiv.appendChild(commentDiv);
                         BL.tocAppend(section);
                     }
                     if(section.code){
                         let codeDiv = document.createElement("div");
                         codeDiv.className = "BL-Code";
                         let id = BL.getCodeId(section.code);
                         console.log("id = '" + id + "'");
                         BL.createCodeNameHtml(codeDiv, id);
                         BL.textAppend(codeDiv, section.code.innerHTML);
                         outerDiv.appendChild(codeDiv);
                     }
                     sourceDiv.appendChild(outerDiv);
                 }
                </script>
            </section>
            <section>
                <header>
                    Get internal ID associated with code node.
                </header>
                <script type="text/x-plain" data-bl="BL_Get_Code_ID">
                 function (codeNode){
                     // treat missing 'data-BL' same as blank (root section).
                     let result = " ";
                     if(codeNode.hasAttribute("data-BL"))
                         result = codeNode.getAttribute("data-BL");
                     return result;
                 }
                </script>
            </section>
            <section>
                <header>
                    Append entry to Table of Contents
                </header>
                <script type="text/x-plain" data-bl="BL_TOC_Append">
                 tocAppend: function(section){
                     let commentDiv = section.comment;
                     if(commentDiv){
                         // will append first <h*> tag (if any) to TOC.
                         for(let childNode of commentDiv.children)
                             if(childNode.tagName.match(/^[Hh][0-9]$/)){
                                 let headerClone = childNode.cloneNode(false);
                                 let id = section.node.id;
                                 let anchor = BL.cloneRename(childNode, "a");
                                 if(id)
                                     anchor.href = "#" + section.node.id;
                                 headerClone.appendChild(anchor);
                                 BL.index.tocDiv.appendChild(headerClone);
                                 break;
                             }
                     }
                 }
                </script>
            </section>
            <section>
                <header>
                    Create new element with children cloned from other element.
                </header>
                <script type="text/x-plain" data-bl="BL_Clone_Rename">
                 function(node, newName){
                     let newParent = document.createElement(newName);
                     for(let childNode of node.childNodes){

                     return newParent;

            <section>

                <script type="text/x-plain" data-bl="BL_Create_Code_Name_HTML">
                 function (parentDiv, codeId){
                     //                 console.log("createCodeNameHtml: '" + codeId + "'");
                     if(codeId != " "){
                         let arity = BL.index.codeObjects[codeId].length;
                         let suffix= "&#x3009;"; // 
                         if(arity > 1)
                             suffix += "&#x2795;";
                         suffix += "&#x2630;";
                         let para  = document.createElement("p");
                         let span  = BL.createSpanHtml("BL-CodeNameBrackets", "&#x3008;");
                         para.appendChild(span);
                         span = BL.createSpanHtml("BL-CodeName", BL.index.idText[codeId]);
                         para.appendChild(span);
                         span  = BL.createSpanHtml("BL-CodeNameBrackets", suffix);
                         para.appendChild(span);
                         parentDiv.appendChild(para);
                     }
                 }
                </script>
            </section>
            <section>
                <header>
                    Create element (default = "span") from some inner HTML.
                </header>
                <script type="text/x-plain" data-bl="BL_Create_Span_HTML">
                 function (className, innerHTML, tag="span"){

            <section>
                <header>
                    From CSS color value, return CSS color/background-color directive
                </header>
                <script type="text/x-plain" data-bl="BL_Get_CSS_Color">
                 function(token){
                     let r, g, b, match, result = "background-color: " + token;
                     if(token.length == 5){
                         match = token.match(/^#([0-9A-Fa-f])([0-9A-Fa-f])([0-9A-Fa-f]);$/);
                         r = match[1] + match[1];
                         g = match[2] + match[2];
                         b = match[3] + match[3];
                     }
                     else{
                         match = token.match(/^#([0-9A-Fa-f][0-9A-Fa-f])([0-9A-Fa-f][0-9A-Fa-f])([0-9A-Fa-f][0-9A-Fa-f]);$/);
                         r = match[1];
                         g = match[2];
                         b = match[3];
                     }
                     r = parseInt(r,16); g = parseInt(g,16); b = parseInt(b,16);
                     let brightness = (r + r + b + g + g + g)/6;
                     if(brightness > 100){
                         result += " color : black";
                     }
                     else
                         result += " color : white";
                     return result;
                 }
                </script>
            </section>
            <section>
                <header>
                    Append HTML representation of given source text
                </header>
                <script type="text/x-plain" data-bl="BL_Text_Append">
                 function BL_textAppend(parentDiv, text){
                     let indent = null;
                     let lex    = BL.tokenizer(text);
                     for(let token of lex){
                         // if first non-empty line, establish amount of input over-indent.
                         if(!indent && token != '\n'){
                             indent = token.slice(0, token.search(/\S|$/));
                             indent = new RegExp("^" + indent);
                         }

                         if(indent)
                             token = token.replace(indent, "");
                         let element = null;
                         if(token == '\n')
                             element = document.createElement("br");
                         else if(0 == token.search(/^[@]<.*@>$/)
                                 && token != "@" + "<@template@>"){
                             let id=token.slice(2,-2);
                             element = document.createElement("span");
                             element.className = "BL-Code-Ref";
                             element.innerHTML = '\u00AB' + BL.index.idText[id] + '\u00BB';
                         }
                         else if(0 == token.search(/^#[0-9A-Fa-f]+;/)){
                             element = document.createElement("span");
                             element.innerHTML = token;
                             let cssColor = BL.getCssColor(token);
                             element.style.cssText = cssColor;
                         }
                         else
                             element = document.createTextNode(token);
                         parentDiv.appendChild(element);
                     }
                 }
                </script>
            </section>
            <section>
                <div>
                    <h2>Tokenizer</h2>
                    Modest complexity + modest local state +
                    creating a stream of objects = plausible
                    use for coroutine.
                    Javascript provides a weak coroutine facility
                    with its "generators".
                </div>
                <header>
                    Create tokenizer for given text.
                </header>
                <script type="text/x-plain" data-bl="BL_Tokenizer">
                 function * BL_tokenizer(text){
                     let scrap="";
                     let curPos=0, firstPos=0, maxPos = text.length;
                     if(text.charAt(0) == '\n')
                         curPos = firstPos = 1;
                     for(; curPos < text.length; ++curPos){
                         switch(text.charAt(curPos)){
                             case '\n':
                                 if(curPos > firstPos)
                                     yield text.slice(firstPos, curPos);
                                 yield "\n";
                                 break;
                             case '&': //??? unaware what context we're in, I think
                                 let pattern = /&lt;(\/script|script )/;
                                 scrap = text.slice(curPos, curPos+11);
                                 //  console.log("---scrap = '" + scrap + "'");
                                 if(scrap.match(pattern)){
                                     if(curPos > firstPos)
                                         yield text.slice(firstPos, curPos);
                                     console.log("rewrite: '" + "<" + scrap.slice(4) + "'");
                                     yield "<" + scrap.slice(4);
                                     curPos += (11-1);
                                     break;
                                 }
                                 // else, accumulate
                                 continue;
                                 break;
                             case '#' :
                                 // might be HTML color
                                 scrap = text.slice(curPos, curPos+2+6);
                                 let match = scrap.match(/^#[0-9A-Fa-f]+;/);
                                 if(match && (match[0].length == 5 || match[0].length == 8)){
                                     if(curPos > firstPos)
                                         yield text.slice(firstPos, curPos);
                                     yield match[0];
                                     curPos += (match[0].length - 1);
                                     break;
                                 }
                                 // else, accumulate
                                 continue;
                             case '@' :
                                 // might be code reference ??? need more rigorous match!
                                 if(text.charAt(curPos+1) == '<'){
                                     let matchPos = text.slice(curPos+1).indexOf("@>");
                                     if(matchPos != -1){
                                         // OK, we have a reference
                                         if(curPos > firstPos)
                                             yield text.slice(firstPos, curPos);
                                         yield text.slice(curPos, curPos+matchPos+3);
                                         curPos += matchPos+2;
                                         break;
                                     }
                                 }
                                 // else, accumulate
                                 continue;
                             default: // accumulate
                                 continue;
                         }
                         firstPos = curPos+1;
                     }
                     // if we've accumulated text we haven't emitted
                     if(curPos > firstPos)
                         yield text.slice(firstPos, curPos);
                 }
                </script>
            </section>
